name: Harden operator core
on:
  push:
    branches: [agent/operator-test-core-clean]
    paths:
      - .github/workflows/harden-operator-core.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-test-core-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact authorization and privacy hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, expected: int = 1) -> str:
            count = text.count(old)
            if count != expected:
              raise SystemExit(f'expected {expected} matches, found {count}: {old[:80]}')
            return text.replace(old, new)

          source_path = Path('packages/database/src/operator-channel-test.ts')
          source = source_path.read_text()
          unique_replacements = [
            (
              "import type { AuthorizationContext } from '@lead-finder/shared';",
              "import { isTrustedAuthorizationContext, type AuthorizationContext } from '@lead-finder/shared';",
            ),
            (
              "      | 'INVALID_FINGERPRINT_KEY'\n      | 'IDEMPOTENCY_CONFLICT',",
              "      | 'INVALID_FINGERPRINT_KEY'\n      | 'IDEMPOTENCY_CONFLICT'\n      | 'FORBIDDEN',",
            ),
            (
              "const clean = (value: string | undefined) =>\n  Array.from(value ?? '', (character) => {\n    const code = character.charCodeAt(0);\n    return code < 32 || code === 127 ? ' ' : character;\n  })\n    .join('')\n    .trim()\n    .slice(0, 500) || undefined;\n\n",
              "const requirePermission = (auth: AuthorizationContext, permission: string) => {\n  if (!isTrustedAuthorizationContext(auth) || !auth.permissions.has(permission)) {\n    throw new OperatorChannelTestError('Operator test permission denied', 'FORBIDDEN');\n  }\n};\n\n",
            ),
            (
              ") {\n  const built = buildOperatorTestPreparation(runtime);",
              ") {\n  requirePermission(auth, 'operator-test:prepare');\n  const built = buildOperatorTestPreparation(runtime);",
            ),
            (
              "  input.idempotencyKey,\n  undefined,\n  auth,\n  runtime,\n);",
              "  input.idempotencyKey,\n  auth,\n  runtime,\n  'operator-test:open',\n);",
            ),
            (
              "  idempotencyKey: string,\n  observation: string | undefined,\n  auth: AuthorizationContext,\n  runtime: OperatorTestRuntime,\n) {\n  const recipient = resolveOperatorTestRecipient(runtime);\n  const normalizedObservation = clean(observation);",
              "  idempotencyKey: string,\n  auth: AuthorizationContext,\n  runtime: OperatorTestRuntime,\n  requiredPermission: string,\n) {\n  requirePermission(auth, requiredPermission);\n  const recipient = resolveOperatorTestRecipient(runtime);",
            ),
            (
              "    result,\n    observation: normalizedObservation,\n    principalId: auth.principalId,",
              "    result,\n    principalId: auth.principalId,",
            ),
            (
              "          preparation_id,event_type,result,operator_principal_id,observation,payload_fingerprint,idempotency_key\n        ) values(\n          ${preparationId}::uuid,${eventType},${result ?? null},${auth.principalId},\n          ${normalizedObservation ?? null},${payloadFingerprint},${idempotencyKey}",
              "          preparation_id,event_type,result,operator_principal_id,payload_fingerprint,idempotency_key\n        ) values(\n          ${preparationId}::uuid,${eventType},${result ?? null},${auth.principalId},\n          ${payloadFingerprint},${idempotencyKey}",
            ),
          ]
          for old, new in unique_replacements:
            source = replace_exact(source, old, new)

          source = replace_exact(
            source,
            "    idempotencyKey: string;\n    observation?: string | undefined;\n  },",
            "    idempotencyKey: string;\n  },",
            expected=2,
          )
          shared_call = "  input.idempotencyKey,\n  input.observation,\n  auth,\n  runtime,\n);"
          if source.count(shared_call) != 2:
            raise SystemExit(f'expected 2 event call matches, found {source.count(shared_call)}')
          source = source.replace(
            shared_call,
            "  input.idempotencyKey,\n  auth,\n  runtime,\n  'operator-test:confirm',\n);",
            1,
          )
          source = source.replace(
            shared_call,
            "  input.idempotencyKey,\n  auth,\n  runtime,\n  'operator-test:response',\n);",
            1,
          )
          source_path.write_text(source)

          migration_path = Path('database/migrations/0021_operator_channel_test.sql')
          migration = migration_path.read_text()
          migration = replace_exact(
            migration,
            "  observation text CHECK (observation IS NULL OR char_length(observation) <= 500),\n",
            '',
          )
          migration_path.write_text(migration)

          integration_path = Path('scripts/operator-channel-test.integration.ts')
          integration = integration_path.read_text()
          marker = """try {
  await raw`truncate operator_channel_test_events,operator_channel_test_preparations restart identity cascade`;

"""
          inserted = """try {
  await raw`truncate operator_channel_test_events,operator_channel_test_preparations restart identity cascade`;

  const unauthorized = createAuthorizationContext({
    principalId: 'operator-test-without-permission',
    permissions: new Set(),
    authenticationMethod: 'integration-test',
  });
  await expectCode(
    prepareOperatorWhatsAppTest(db, input(), unauthorized, runtime),
    'FORBIDDEN',
  );
  const forged = {
    principalId: 'forged-operator-test',
    permissions: new Set(['operator-test:prepare']),
    authenticationMethod: 'forged',
  } as Parameters<typeof prepareOperatorWhatsAppTest>[2];
  await expectCode(
    prepareOperatorWhatsAppTest(db, input(), forged, runtime),
    'FORBIDDEN',
  );
  pass('00 untrusted or unauthorized contexts are rejected');

"""
          integration = replace_exact(integration, marker, inserted)
          integration_path.write_text(integration)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run packages/database/src/operator-channel-test.test.ts
      - name: Commit hardened core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/migrations/0021_operator_channel_test.sql packages/database/src/operator-channel-test.ts scripts/operator-channel-test.integration.ts
          git commit -m 'security: enforce operator permissions and structured events'
          git push origin HEAD:agent/operator-test-core-clean
