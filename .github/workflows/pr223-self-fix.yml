name: PR223 self-contained follow-up patch

on:
  push:
    branches:
      - fix/pr215-final-review-followups-20260807
  pull_request:
    branches:
      - hml/render-supabase-plan-b

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr215-final-review-followups-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply final-review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_first(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected at least one match: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'packages/database/src/index.ts',
              "  if (!auth.permissions.has('manual-messaging:send')) {\n    return recordLegacyManualOpen(db, preparationId, input, auth);\n  }\n  return recordRestrictedManualOpen(db, preparationId, input, auth);",
              "  if (!auth.permissions.has('manual-messaging:open')) {\n    return recordLegacyManualOpen(db, preparationId, input, auth);\n  }\n  return recordRestrictedManualOpen(db, preparationId, input, auth);",
          )

          replace_once(
              'apps/api/src/app.ts',
              "error.code==='WHATSAPP_CLOUD_UNAVAILABLE'||error.code==='WHATSAPP_CLOUD_AMBIGUOUS'?503:422",
              "error.code==='EMAIL_CONSUMER_UNAVAILABLE'||error.code==='WHATSAPP_CLOUD_UNAVAILABLE'||error.code==='WHATSAPP_CLOUD_AMBIGUOUS'?503:422",
          )
          replace_once(
              'apps/api/src/app.ts',
              "if(!manualEmailSendEnabled||!options.deliverManualEmail||!options.manualEmailSender||!options.manualEmailFingerprintKey)return reply.status(503).send({error:'Service unavailable',code:'MANUAL_EMAIL_DISABLED'});",
              "",
          )
          replace_once(
              'apps/api/src/app.ts',
              "{sendEnabled:manualEmailSendEnabled,killSwitchEnabled:options.manualEmailKillSwitchEnabled ?? true,sender:options.manualEmailSender!,fingerprintKey:options.manualEmailFingerprintKey!,deliver:options.deliverManualEmail!}",
              "{sendEnabled:manualEmailSendEnabled&&Boolean(options.deliverManualEmail&&options.manualEmailSender&&options.manualEmailFingerprintKey),killSwitchEnabled:options.manualEmailKillSwitchEnabled ?? true,sender:options.manualEmailSender??'',fingerprintKey:options.manualEmailFingerprintKey??'',deliver:options.deliverManualEmail??(()=>Promise.reject(new Error('MANUAL_EMAIL_DISABLED')))}",
          )

          old_v1_exact = """        AND (\n          result_snapshot - ARRAY[\n            'schemaVersion',\n            'channel',\n            'templateId',\n            'templateVersion',\n            'variables',\n            'renderedInputsFingerprint',\n            'contactFingerprint',\n            'messageFingerprint'\n          ]::text[]\n        ) = '{}'::jsonb\n"""
          replace_first(
              'database/migrations/0044_manual_email_historical_snapshot_compatibility.sql',
              old_v1_exact,
              '',
          )
          PY
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: git diff --check
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr223-self-fix.yml
          git add apps/api/src/app.ts packages/database/src/index.ts database/migrations/0044_manual_email_historical_snapshot_compatibility.sql
          git commit -m "fix: address restricted email final review findings"
          git push origin HEAD:fix/pr215-final-review-followups-20260807
