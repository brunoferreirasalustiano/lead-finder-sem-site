services:
  - type: web
    name: lead-finder-api-hml
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/brunoferreirasalustiano/lead-finder-sem-site
    branch: hml/render-supabase-plan-b
    autoDeployTrigger: off
    numInstances: 1
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/index.js
    healthCheckPath: /health/ready
    envVars:
      - { key: DEPLOYMENT_PROFILE, value: supabase-render }
      - { key: DEPLOYMENT_ENVIRONMENT, value: homologation }
      - { key: NODE_ENV, value: production }
      - { key: DRY_RUN, value: 'true' }
      - { key: SHADOW_MODE_ENABLED, value: 'true' }
      - { key: REAL_SEND_ENABLED, value: 'false' }
      - { key: REAL_PROVIDERS_ENABLED, value: 'false' }
      - { key: REAL_PROVIDER_CONFIGURED, value: 'false' }
      - { key: COLLECTION_EGRESS_ENABLED, value: 'false' }
      - { key: ENRICHMENT_EGRESS_ENABLED, value: 'false' }
      - { key: DAILY_LEAD_LIMIT, value: '60' }
      - { key: LEAD_BATCH_SIZE, value: '5' }
      - { key: PROCESSING_TIME_BUDGET_MS, value: '45000' }
      - { key: DATABASE_POOL_MAX, value: '3' }
      - { key: DATABASE_SSL_MODE, value: require }
      - { key: PROCESSOR_ROLE, value: primary }
      - { key: DATABASE_URL, sync: false }
      - { key: API_AUTH_TOKEN, sync: false }
      - { key: API_AUTH_PERMISSIONS, sync: false }
      - { key: INTERNAL_CRON_SECRET, sync: false }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: PILOT_KILL_SWITCH_ENABLED, value: 'false' }
      - { key: OPERATOR_EMAIL_TEST_ENABLED, value: 'false' }
      - { key: OPERATOR_EMAIL_TEST_KILL_SWITCH_ENABLED, value: 'true' }
      - { key: OPERATOR_EMAIL_TEST_RECIPIENT, sync: false }
      - { key: OPERATOR_EMAIL_TEST_SENDER, sync: false }
      - { key: OPERATOR_EMAIL_TEST_GOOGLE_CLIENT_ID, sync: false }
      - { key: OPERATOR_EMAIL_TEST_GOOGLE_CLIENT_SECRET, sync: false }
      - { key: OPERATOR_EMAIL_TEST_GOOGLE_REFRESH_TOKEN, sync: false }
      - { key: OPERATOR_EMAIL_TEST_FINGERPRINT_KEY, sync: false }
      - { key: MANUAL_EMAIL_SEND_ENABLED, value: 'false' }
      - { key: DAILY6_PILOT_ENABLED, value: 'false' }
      - { key: MANUAL_EMAIL_KILL_SWITCH_ENABLED, value: 'true' }
      - { key: MANUAL_EMAIL_SENDER, sync: false }
      - { key: MANUAL_EMAIL_GOOGLE_CLIENT_ID, sync: false }
      - { key: MANUAL_EMAIL_GOOGLE_CLIENT_SECRET, sync: false }
      - { key: MANUAL_EMAIL_GOOGLE_REFRESH_TOKEN, sync: false }
      - { key: MANUAL_EMAIL_FINGERPRINT_KEY, sync: false }
