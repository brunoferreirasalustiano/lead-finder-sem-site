name: Generate toolchain lock
on:
  push:
    branches: [security/dev-toolchain-cve-2026-14257]
    paths:
      - package.json
      - .github/workflows/generate-toolchain-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dev-toolchain-cve-2026-14257
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove clean install from generated lock
        run: npm ci
      - name: Prove high and critical audit is clean
        run: npm audit --audit-level=high
      - name: Commit generated lockfile to this branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: regenerate lockfile for upgraded toolchain'
          git push origin HEAD:security/dev-toolchain-cve-2026-14257
