name: One-shot CRM integration reconciliation

on:
  push:
    branches:
      - security/crm-idempotency-safe-results
    paths:
      - .github/workflows/one-shot-reconcile-crm-integration.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/crm-idempotency-safe-results
          fetch-depth: 0

      - name: Replace obsolete loss-reason assertion
        shell: python
        run: |
          from pathlib import Path

          test_path = Path('scripts/integration-test.ts')
          workflow_path = Path('.github/workflows/one-shot-reconcile-crm-integration.yml')
          source = test_path.read_text(encoding='utf-8')
          old = """  assert.equal(lost.statusCode, 200);
            assert.equal(lost.json<{ lossReason: string }>().lossReason, 'Budget deferred');
            assert.ok(lost.json<{ closedAt: string | null }>().closedAt);
          """
          new = """  assert.equal(lost.statusCode, 200);
            const lostResponse = lost.json<Record<string, unknown>>();
            assert.equal(Object.hasOwn(lostResponse, 'lossReason'), false);
            assert.ok(lostResponse['closedAt']);
            const canonicalLossReason = await db.execute<{ loss_reason: string | null }>(
              sql`select loss_reason from crm_opportunities where id = ${opportunity.id}::uuid`,
            );
            assert.equal(canonicalLossReason[0]?.loss_reason, 'Budget deferred');
          """
          if source.count(old) != 1:
              raise SystemExit('expected CRM assertion block was not found exactly once')
          test_path.write_text(source.replace(old, new), encoding='utf-8')
          workflow_path.unlink()

      - name: Commit exact reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/integration-test.ts .github/workflows/one-shot-reconcile-crm-integration.yml
          git diff --cached --check
          git commit -m "test: verify canonical loss reason outside safe HTTP response"
          git push origin HEAD:security/crm-idempotency-safe-results
