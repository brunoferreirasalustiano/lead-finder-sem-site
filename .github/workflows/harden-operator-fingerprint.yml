name: Harden operator fingerprint
on:
  push:
    branches: [agent/operator-test-api]
    paths:
      - .github/workflows/harden-operator-fingerprint.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-test-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact HMAC hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/database/src/operator-channel-test.ts')
          source = source_path.read_text()

          replacements = [
            (
              "import { createHash } from 'node:crypto';",
              "import { createHash, createHmac } from 'node:crypto';",
            ),
            (
              "  authorizedPhoneE164?: string | undefined;\n}>;",
              "  authorizedPhoneE164?: string | undefined;\n  fingerprintKey?: string | undefined;\n}>;",
            ),
            (
              "      | 'INVALID_RECIPIENT'\n      | 'IDEMPOTENCY_CONFLICT',",
              "      | 'INVALID_RECIPIENT'\n      | 'INVALID_FINGERPRINT_KEY'\n      | 'IDEMPOTENCY_CONFLICT',",
            ),
            (
              "  const normalized = normalizePhoneE164(runtime.authorizedPhoneE164);",
              "  const fingerprintKey = runtime.fingerprintKey?.trim();\n  if (!fingerprintKey || fingerprintKey.length < 32) {\n    throw new OperatorChannelTestError(\n      'Operator test fingerprint key is invalid',\n      'INVALID_FINGERPRINT_KEY',\n    );\n  }\n  const normalized = normalizePhoneE164(runtime.authorizedPhoneE164);",
            ),
            (
              "    fingerprint: digest({\n      channel: 'WHATSAPP',\n      purpose: 'OPERATOR_TEST',\n      value: normalized.e164,\n    }),",
              "    fingerprint: createHmac('sha256', fingerprintKey)\n      .update(JSON.stringify(canonical({\n        channel: 'WHATSAPP',\n        purpose: 'OPERATOR_TEST',\n        value: normalized.e164,\n      })))\n      .digest('hex'),",
            ),
          ]

          for old, new in replacements:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one source match, found {count}: {old[:60]}')
            source = source.replace(old, new)
          source_path.write_text(source)

          test_path = Path('packages/database/src/operator-channel-test.test.ts')
          test = test_path.read_text()
          test_replacements = [
            (
              "  authorizedPhoneE164: '+5511999999999',\n} as const;",
              "  authorizedPhoneE164: '+5511999999999',\n  fingerprintKey: 'operator-test-fingerprint-key-0001',\n} as const;",
            ),
            (
              "  it('rejects a missing or malformed operator recipient', () => {",
              "  it('fails closed when the fingerprint key is missing or too short', () => {\n    expect(errorCodeFrom(() => resolveOperatorTestRecipient({\n      enabled: true,\n      killSwitchEnabled: false,\n      authorizedPhoneE164: '+5511999999999',\n    }))).toBe('INVALID_FINGERPRINT_KEY');\n    expect(errorCodeFrom(() => resolveOperatorTestRecipient({\n      enabled: true,\n      killSwitchEnabled: false,\n      authorizedPhoneE164: '+5511999999999',\n      fingerprintKey: 'short-key',\n    }))).toBe('INVALID_FINGERPRINT_KEY');\n  });\n\n  it('rejects a missing or malformed operator recipient', () => {",
            ),
            (
              "      authorizedPhoneE164: 'not-a-phone',\n    }))).toBe('INVALID_RECIPIENT');",
              "      authorizedPhoneE164: 'not-a-phone',\n      fingerprintKey: enabledRuntime.fingerprintKey,\n    }))).toBe('INVALID_RECIPIENT');",
            ),
            (
              "    expect(first.fingerprint).not.toContain('5511999999999');\n  });",
              "    const rotatedKey = resolveOperatorTestRecipient({\n      ...enabledRuntime,\n      fingerprintKey: 'operator-test-fingerprint-key-0002',\n    });\n\n    expect(first.fingerprint).not.toContain('5511999999999');\n    expect(first.fingerprint).not.toBe(rotatedKey.fingerprint);\n  });",
            ),
          ]
          for old, new in test_replacements:
            count = test.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one test match, found {count}: {old[:60]}')
            test = test.replace(old, new)
          test_path.write_text(test)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run packages/database/src/operator-channel-test.test.ts
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/operator-channel-test.ts packages/database/src/operator-channel-test.test.ts
          git commit -m 'security: protect operator recipient fingerprint with HMAC'
          git push origin HEAD:agent/operator-test-api
