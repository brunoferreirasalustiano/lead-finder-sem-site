services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadfinder}
      POSTGRES_USER: ${POSTGRES_USER:-leadfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env}
      DAILY_LEAD_LIMIT: ${DAILY_LEAD_LIMIT:-50}
      COLLECTION_EGRESS_ENABLED: ${COLLECTION_EGRESS_ENABLED:-false}
      OVERPASS_API_URL: ${OVERPASS_API_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leadfinder}
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leadfinder}
    command: [npm, run, db:migrate]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leadfinder}
      COLLECTION_EGRESS_ENABLED: ${COLLECTION_EGRESS_ENABLED:-false}
      OVERPASS_API_URL: ${OVERPASS_API_URL:-}
      OVERPASS_TIMEOUT_MS: ${OVERPASS_TIMEOUT_MS:-30000}
      OVERPASS_MAX_RETRIES: ${OVERPASS_MAX_RETRIES:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-60000}
      SHADOW_MODE_ENABLED: ${SHADOW_MODE_ENABLED:?Set SHADOW_MODE_ENABLED=true for shadow operation}
      DAILY_LEAD_LIMIT: ${DAILY_LEAD_LIMIT:-50}
    depends_on: { postgres: { condition: service_healthy } }
    extra_hosts: ['host.docker.internal:host-gateway']
    healthcheck:
      test: [CMD-SHELL, kill -0 1]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]
  n8n:
    image: n8nio/n8n:1.99.1
    profiles: [integration]
    restart: unless-stopped
    environment:
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    volumes: [n8n_data:/home/node/.n8n, ./n8n/workflows:/workflows:ro]
    ports: ['127.0.0.1:5678:5678']
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]
volumes: { postgres_data: {}, n8n_data: {} }
networks: { internal: {} }
