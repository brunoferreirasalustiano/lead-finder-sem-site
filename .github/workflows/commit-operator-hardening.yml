name: Commit operator hardening
on:
  push:
    branches: [agent/operator-test-core-clean]
    paths:
      - .github/workflows/commit-operator-hardening.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/commit-operator-hardening.yml
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-test-core-clean
      - name: Reuse reviewed hardening transform
        id: transform
        continue-on-error: true
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import traceback

          try:
            workflow = Path('.github/workflows/harden-operator-core.yml').read_text()
            prefix = "python3 - <<'PY'\n"
            suffix = "\n          PY\n"
            if workflow.count(prefix) != 1 or workflow.count(suffix) != 1:
              raise RuntimeError('unable to locate reviewed hardening transform')
            extracted = workflow.split(prefix, 1)[1].split(suffix, 1)[0]
            lines = extracted.splitlines()
            script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
            )
            exec(compile(script, 'operator-hardening-transform', 'exec'))
          except BaseException:
            Path('hardening-error.txt').write_text(traceback.format_exc())
            raise
          PYRUN
      - name: Upload hardening diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-hardening-diagnostic-${{ github.sha }}
          path: hardening-error.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit patch before full CI validation
        if: steps.transform.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/migrations/0021_operator_channel_test.sql packages/database/src/operator-channel-test.ts scripts/operator-channel-test.integration.ts
          git commit -m 'security: enforce operator permissions and structured events'
          git push origin HEAD:agent/operator-test-core-clean
      - name: Fail after diagnostic upload
        if: steps.transform.outcome != 'success'
        run: exit 1
