name: Dependency audit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment-profile: [oracle-vps, supabase-render]
    env:
      DEPLOYMENT_PROFILE: ${{ matrix.deployment-profile }}
      DRY_RUN: 'true'
      REAL_SEND_ENABLED: 'false'
      REAL_PROVIDERS_ENABLED: 'false'
      COLLECTION_EGRESS_ENABLED: 'false'
      SHADOW_MODE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture npm audit JSON
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > "audit-${DEPLOYMENT_PROFILE}.json"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const profile = process.env.DEPLOYMENT_PROFILE;
          const path = `audit-${profile}.json`;
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const metadata = report.metadata?.vulnerabilities ?? {};
          const findings = Object.entries(report.vulnerabilities ?? {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            isDirect: value.isDirect,
            via: Array.isArray(value.via)
              ? value.via.map((entry) => typeof entry === 'string'
                ? entry
                : { source: entry.source, name: entry.name, title: entry.title, url: entry.url, severity: entry.severity, range: entry.range })
              : value.via,
            effects: value.effects,
            range: value.range,
            nodes: value.nodes,
            fixAvailable: value.fixAvailable,
          }));
          console.log(JSON.stringify({ profile, metadata, findings }, null, 2));
          NODE
          exit 0
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.deployment-profile }}-${{ github.sha }}
          path: audit-${{ matrix.deployment-profile }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce audit gate
        run: exit "${{ steps.audit.outputs.exit_code }}"
