x-logging: &production-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

x-security: &production-security
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *production-security
    ports: !reset []
    logging: *production-logging
    networks: [database]
  api:
    <<: *production-security
    ports: !reset []
    expose: ['3000']
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    logging: *production-logging
    networks: [database, proxy]
  migrate:
    <<: *production-security
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    logging: *production-logging
    networks: [database]
  worker:
    <<: *production-security
    ports: !reset []
    extra_hosts: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    logging: *production-logging
    networks: [database]
  n8n:
    <<: *production-security
    profiles: [n8n]
    ports: !reset []
    expose: ['5678']
    environment:
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_DOMAIN:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN:-localhost}/
    logging: *production-logging
    networks: [proxy]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      N8N_DOMAIN: ${N8N_DOMAIN:-automacao.invalid}
      ACME_EMAIL: ${ACME_EMAIL:-off}
    volumes:
      - ${CADDYFILE_PATH:-./deploy/Caddyfile.example}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, caddy, version]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *production-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [proxy]
volumes:
  caddy_data:
  caddy_config:
networks:
  internal: { internal: true }
  database: { internal: true }
  proxy:
