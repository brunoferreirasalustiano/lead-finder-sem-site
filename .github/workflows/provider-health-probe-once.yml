name: Provider health probe once

on:
  push:
    branches:
      - probe/provider-health-once-ea228eb

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: hml-discovery
    timeout-minutes: 5
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_MIN_INTERVAL_MS: '1000'
      TAVILY_RATE_LIMIT_RECOVERY_MAX_WAIT_MS: '10000'
      CNPJ_PROVIDER_MAX_RPM: '3'
      APPROVED_HML_SHA: ea228eb49c1c54c7bed7c43a6fb91a2cc2f865f1

    steps:
      - name: Checkout exact approved HML SHA
        uses: actions/checkout@v4
        with:
          ref: ea228eb49c1c54c7bed7c43a6fb91a2cc2f865f1
          fetch-depth: 1

      - name: Verify exact SHA and no collection credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_HML_SHA"
          test -n "$TAVILY_API_KEY"
          test -z "${HML_COLLECTION_TOKEN:-}"
          test -z "${DATABASE_URL:-}"

      - name: Probe provider health and usage only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$TAVILY_MIN_INTERVAL_MS" -ge 1000
          test "$TAVILY_RATE_LIMIT_RECOVERY_MAX_WAIT_MS" -le 60000
          test "$CNPJ_PROVIDER_MAX_RPM" -le 3
          tavily_usage_file="$(mktemp)"
          trap 'rm -f "$tavily_usage_file"' EXIT
          tavily_status="$(curl --silent --show-error --max-time 20 \
            -o "$tavily_usage_file" -w '%{http_code}' \
            -H "Authorization: Bearer $TAVILY_API_KEY" \
            https://api.tavily.com/usage)"
          test "$tavily_status" = 200
          tavily_usage="$(jq -er '.key.usage | numbers' "$tavily_usage_file")"
          tavily_limit="$(jq -er '.key.limit | numbers' "$tavily_usage_file")"
          test "$tavily_usage" -le "$tavily_limit"
          cnpj_status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            https://publica.cnpj.ws/cnpj/42064856000170)"
          test "$cnpj_status" = 200
          echo "provider_health_evidence provider=TAVILY usage=$tavily_usage limit=$tavily_limit"
          echo "provider_health_evidence provider=CNPJ_WS status=200"
          echo 'PROVIDER_HEALTH_OR_USAGE_EVIDENCE=PASS'
          echo 'DISCOVERY_DISPATCHED=false'
          echo 'COLLECTION_JOB_CREATED=false'
