name: Sync current HML baseline for PR 234 (temporary)

on:
  push:
    branches:
      - fix/hml-email-operator-principal

permissions:
  contents: write

jobs:
  sync-hml-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: fix/hml-email-operator-principal
          fetch-depth: 0

      - name: Fetch current HML
        run: git fetch origin hml/render-supabase-plan-b --depth=1

      - name: Adopt current non-functional HML baseline
        run: git checkout origin/hml/render-supabase-plan-b -- package.json package-lock.json apps/api/Dockerfile apps/worker/Dockerfile

      - name: Verify security and multiarch baseline
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.overrides?.nanoid !== '5.1.16' || l.packages?.['node_modules/nanoid']?.version !== '5.1.16') process.exit(1)"
          grep -F 'FROM --platform=$BUILDPLATFORM node:22-alpine AS build' apps/api/Dockerfile
          grep -F 'FROM --platform=$BUILDPLATFORM node:22-alpine AS build' apps/worker/Dockerfile
          grep -F "@lead-finder/email" apps/api/Dockerfile

      - name: Commit baseline and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/sync-hml-baseline-pr234-v2-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/api/Dockerfile apps/worker/Dockerfile .github/workflows/sync-hml-baseline-pr234-v2-temporary.yml
          git diff --cached --check
          git commit -m "chore: sync current HML runtime baseline" || exit 0
          git push origin HEAD:fix/hml-email-operator-principal
