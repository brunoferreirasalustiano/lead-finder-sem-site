name: Commit operator hardening
on:
  push:
    branches: [agent/operator-test-core-clean]
    paths:
      - .github/workflows/commit-operator-hardening.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/commit-operator-hardening.yml
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-test-core-clean
      - name: Reuse reviewed hardening transform
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/harden-operator-core.yml').read_text()
          prefix = "python3 - <<'PY'\n"
          suffix = "\n          PY\n"
          if workflow.count(prefix) != 1 or workflow.count(suffix) != 1:
            raise SystemExit('unable to locate reviewed hardening transform')
          script = workflow.split(prefix, 1)[1].split(suffix, 1)[0]
          exec(compile(textwrap.dedent(script), 'operator-hardening-transform', 'exec'))
          PYRUN
      - name: Commit patch before full CI validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/migrations/0021_operator_channel_test.sql packages/database/src/operator-channel-test.ts scripts/operator-channel-test.integration.ts
          git commit -m 'security: enforce operator permissions and structured events'
          git push origin HEAD:agent/operator-test-core-clean
