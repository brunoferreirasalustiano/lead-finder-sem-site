name: Daily-6 native dispatcher

# GitHub evaluates scheduled workflows from the default branch.  This small
# control plane therefore lives on main and invokes the already-approved HML
# runtime by its immutable SHA.  The HML branch check makes drift fail closed.
# Scheduled runs intentionally avoid minute 00 because GitHub Actions may
# delay high-load scheduled workflows at the top of the hour.
# A delayed event remains fail-closed after this bounded window; it must never
# become an implicit catch-up run for a commercial slot.
on:
  schedule:
    - cron: '7 12 * * *' # 09:07 America/Sao_Paulo (UTC-3), logical slot 09
    - cron: '7 16 * * *' # 13:07 America/Sao_Paulo (UTC-3), logical slot 13
    - cron: '7 19 * * *' # 16:07 America/Sao_Paulo (UTC-3), logical slot 16
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved HML SHA
        required: true
        type: string
        default: f96ee8b10b7da55ec2e5bd5f69b5b44b6c063985
      date:
        description: Current slot date in America/Sao_Paulo (YYYY-MM-DD)
        required: true
        type: string
      slot:
        description: Current Daily-6 slot
        required: true
        type: choice
        options:
          - '09'
          - '13'
          - '16'

permissions:
  contents: read

concurrency:
  group: daily6-dispatcher-${{ github.event.schedule || format('{0}|{1}', inputs.date, inputs.slot) }}
  cancel-in-progress: false

env:
  EXPECTED_OPERATIONAL_SHA: f96ee8b10b7da55ec2e5bd5f69b5b44b6c063985
  HML_BRANCH: hml/render-supabase-plan-b
  MAX_SCHEDULE_LATENESS_SECONDS: '3600'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: hml-discovery
    timeout-minutes: 45
    env:
      HML_API_URL: ${{ vars.HML_API_URL }}
      HML_DAILY6_TOKEN: ${{ secrets.HML_DAILY6_TOKEN }}
      HML_COLLECTION_TOKEN: ${{ secrets.HML_COLLECTION_TOKEN }}
      HML_DATABASE_URL: ${{ secrets.HML_DATABASE_URL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - name: Checkout default branch control plane
        uses: actions/checkout@v4

      - name: Resolve current Campinas slot without catch-up
        id: slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_DATE: ${{ inputs.date }}
          DISPATCH_SLOT: ${{ inputs.slot }}
          DISPATCH_SHA: ${{ inputs.expected_sha }}
        run: |
          set -Eeuo pipefail
          today="$(TZ=America/Sao_Paulo date +%F)"
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ]; then
            test "${GITHUB_RUN_ATTEMPT:-1}" = '1'
            case "$EVENT_SCHEDULE" in
              '7 12 * * *') slot='09'; expected_utc='12:07:00' ;;
              '7 16 * * *') slot='13'; expected_utc='16:07:00' ;;
              '7 19 * * *') slot='16'; expected_utc='19:07:00' ;;
              *) echo 'UNEXPECTED_SCHEDULE' >&2; exit 1 ;;
            esac
            date="$today"
            sha="$EXPECTED_OPERATIONAL_SHA"
            expected_epoch="$(date -u -d "$date $expected_utc" +%s)"
            now_epoch="$(date -u +%s)"
            lateness_seconds=$((now_epoch - expected_epoch))
            test "$lateness_seconds" -ge 0
            test "$lateness_seconds" -le "$MAX_SCHEDULE_LATENESS_SECONDS"
          else
            date="$DISPATCH_DATE"
            slot="$DISPATCH_SLOT"
            sha="$DISPATCH_SHA"
            lateness_seconds='manual'
          fi
          test "$date" = "$today"
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$slot" =~ ^(09|13|16)$ ]]
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$sha" = "$EXPECTED_OPERATIONAL_SHA"
          {
            echo "date=$date"
            echo "slot=$slot"
            echo "sha=$sha"
            echo "lateness_seconds=$lateness_seconds"
          } >> "$GITHUB_OUTPUT"

      - name: Verify HML branch remains pinned to approved SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.slot.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$HML_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Verify Daily-6 operational authorization gate
        shell: bash
        env:
          OPERATIONAL_AUTHORIZATION: ${{ vars.DAILY6_OPERATIONAL_AUTHORIZATION }}
          OPERATIONAL_AUTH_EXPIRES_AT: ${{ vars.DAILY6_OPERATIONAL_AUTH_EXPIRES_AT }}
        run: |
          set -Eeuo pipefail
          test "$OPERATIONAL_AUTHORIZATION" = 'DAILY6_NATIVE_SEND_AUTHORIZED_V1'
          [[ "$OPERATIONAL_AUTH_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          if ! expires_epoch="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%s 2>/dev/null)"; then
            echo 'DAILY6_OPERATIONAL_AUTH_EXPIRES_AT_INVALID' >&2
            exit 1
          fi
          canonical_expiry="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%Y-%m-%dT%H:%M:%SZ)"
          test "$canonical_expiry" = "$OPERATIONAL_AUTH_EXPIRES_AT"
          now_epoch="$(date -u +%s)"
          test "$expires_epoch" -gt "$now_epoch"

      - name: Verify HML readiness and fresh Daily-6 identity
        id: discovery
        shell: bash
        env:
          SLOT_DATE: ${{ steps.slot.outputs.date }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          set -Eeuo pipefail
          test -n "$HML_API_URL"
          test -n "$HML_COLLECTION_TOKEN"
          test -n "$HML_DATABASE_URL"
          test -n "$TAVILY_API_KEY"
          for readiness_attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 15 -X GET \
              "$HML_API_URL/health/ready" >/dev/null; then
              readiness_ok=true
              break
            fi
            if [ "$readiness_attempt" -lt 3 ]; then sleep 5; fi
          done
          test "${readiness_ok:-false}" = true
          request_identity="${SLOT_DATE}|${SLOT}|campinas-sp|daily6-v1"
          [[ "$request_identity" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\|(09|13|16)\|campinas-sp\|daily6-v1$ ]]
          existing_job_count="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$HML_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from public.collection_jobs where request_identity = '$request_identity'")"
          existing_batch_count="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$HML_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc \
            "select lead_finder_internal.daily6_batch_identity_exists('$request_identity')")"
          test "$existing_job_count" = '0'
          test "$existing_batch_count" = 'f'
          echo "request_identity=$request_identity" >> "$GITHUB_OUTPUT"
          echo 'CONTROL_PLANE_PASS=true'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Checkout exact approved HML worker source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_OPERATIONAL_SHA }}
          fetch-depth: 1
          path: hml-worker

      - name: Build the bounded discovery worker
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          npm run build
          echo 'DISCOVERY_WORKER_BUILD=PASS'
        working-directory: hml-worker

      - name: Validate bounded discovery worker configuration before enqueue
        shell: bash
        working-directory: hml-worker
        env:
          DATABASE_URL: ${{ secrets.HML_DATABASE_URL }}
          REQUEST_IDENTITY: ${{ steps.discovery.outputs.request_identity }}
          DEPLOYMENT_ENVIRONMENT: homologation
          DEPLOYMENT_PROFILE: supabase-render
          DATABASE_SSL_MODE: require
          COLLECTION_EGRESS_ENABLED: 'true'
          ENRICHMENT_EGRESS_ENABLED: 'true'
          ENRICHMENT_PROVIDER: composite
          OVERPASS_API_URL: https://overpass-api.de/api/interpreter
          WORKER_MODE: oneshot
          MAX_JOBS_PER_RUN: '1'
          MAX_CANDIDATES_PER_JOB: '40'
          MAX_ENRICHMENT_PER_JOB: '10'
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_MIN_INTERVAL_MS: '1000'
          TAVILY_RATE_LIMIT_RECOVERY_MAX_WAIT_MS: '10000'
          CNPJ_PROVIDER_MAX_RPM: '3'
          PILOT_KILL_SWITCH_ENABLED: 'false'
          DRY_RUN: 'true'
          REAL_SEND_ENABLED: 'false'
          REAL_PROVIDERS_ENABLED: 'false'
          SHADOW_MODE_ENABLED: 'true'
        run: |
          set -Eeuo pipefail
          config_log="$(mktemp)"
          trap 'rm -f "$config_log"' EXIT
          set +e
          node --input-type=module -e "import { parseWorkerConfig } from './packages/shared/dist/config.js'; parseWorkerConfig(process.env);" >"$config_log" 2>&1
          config_exit_code=$?
          set -e
          if [ "$config_exit_code" -ne 0 ]; then
            echo 'DISCOVERY_WORKER_CONFIG=FAIL' >&2
            echo 'DISCOVERY_WORKER_CONFIG_FAILURE_CLASS=INVALID_CONFIGURATION' >&2
            exit 1
          fi
          echo 'DISCOVERY_WORKER_CONFIG=PASS'

      - name: Enqueue one bounded Daily-6 discovery job
        shell: bash
        env:
          REQUEST_IDENTITY: ${{ steps.discovery.outputs.request_identity }}
          OPERATIONAL_AUTHORIZATION: ${{ vars.DAILY6_OPERATIONAL_AUTHORIZATION }}
          OPERATIONAL_AUTH_EXPIRES_AT: ${{ vars.DAILY6_OPERATIONAL_AUTH_EXPIRES_AT }}
        run: |
          set -Eeuo pipefail
          test "$OPERATIONAL_AUTHORIZATION" = 'DAILY6_NATIVE_SEND_AUTHORIZED_V1'
          [[ "$OPERATIONAL_AUTH_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          expires_epoch="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%s)"
          canonical_expiry="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%Y-%m-%dT%H:%M:%SZ)"
          test "$canonical_expiry" = "$OPERATIONAL_AUTH_EXPIRES_AT"
          test "$expires_epoch" -gt "$(date -u +%s)"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$HML_API_URL/collect" \
            -H "Authorization: Bearer $HML_COLLECTION_TOKEN" \
            -H "X-Collection-Identity: $REQUEST_IDENTITY" \
            -H 'Content-Type: application/json' \
            --data '{"city":"Campinas","state":"SP","country":"Brasil","category":"saloes-de-beleza","limit":40}')"
          printf '%s' "$response" | jq -e '.id and (.status == "PENDING" or .status == "PROCESSING" or .status == "COMPLETED")' >/dev/null
          echo 'DISCOVERY_ENQUEUED=true'

      - name: Run one bounded discovery and enrichment worker
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.HML_DATABASE_URL }}
          REQUEST_IDENTITY: ${{ steps.discovery.outputs.request_identity }}
          DEPLOYMENT_ENVIRONMENT: homologation
          DEPLOYMENT_PROFILE: supabase-render
          DATABASE_SSL_MODE: require
          COLLECTION_EGRESS_ENABLED: 'true'
          ENRICHMENT_EGRESS_ENABLED: 'true'
          ENRICHMENT_PROVIDER: composite
          OVERPASS_API_URL: https://overpass-api.de/api/interpreter
          WORKER_MODE: oneshot
          MAX_JOBS_PER_RUN: '1'
          MAX_CANDIDATES_PER_JOB: '40'
          MAX_ENRICHMENT_PER_JOB: '10'
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_MIN_INTERVAL_MS: '1000'
          TAVILY_RATE_LIMIT_RECOVERY_MAX_WAIT_MS: '10000'
          CNPJ_PROVIDER_MAX_RPM: '3'
          PILOT_KILL_SWITCH_ENABLED: 'false'
          DRY_RUN: 'true'
          REAL_SEND_ENABLED: 'false'
          REAL_PROVIDERS_ENABLED: 'false'
          SHADOW_MODE_ENABLED: 'true'
        run: |
          set -Eeuo pipefail
          worker_log="$(mktemp)"
          trap 'rm -f "$worker_log"' EXIT
          set +e
          node hml-worker/apps/worker/dist/index.js >"$worker_log" 2>&1
          worker_exit_code=$?
          set -e
          if [ "$worker_exit_code" -ne 0 ]; then
            worker_failure_class='UNKNOWN'
            if grep -Fq '"event":"worker_startup_blocked"' "$worker_log"; then
              worker_failure_class='INVALID_CONFIGURATION'
            elif grep -Fq '"event":"collection_source_failure"' "$worker_log"; then
              worker_failure_class='COLLECTION_SOURCE_FAILURE'
            elif grep -Fq '"failureClass":"NO_COLLECTION_JOB_CLAIMED"' "$worker_log"; then
              worker_failure_class='COLLECTION_NOT_CLAIMED'
            elif grep -Fq '"event":"worker_fatal"' "$worker_log"; then
              worker_failure_class='WORKER_FATAL'
            fi
            echo 'DISCOVERY_WORKER=FAILED' >&2
            echo "DISCOVERY_WORKER_EXIT_CODE=$worker_exit_code" >&2
            echo "DISCOVERY_WORKER_FAILURE_CLASS=$worker_failure_class" >&2
            exit 1
          fi
          # The worker's persisted collection status is the authoritative
          # discovery proof; worker logs are intentionally discarded to avoid
          # exposing provider/lead data.  Send-provider telemetry is returned
          # by the native run-slot report below.
          test -s "$worker_log"
          echo 'DISCOVERY_WORKER=PASS'
          echo 'DISCOVERY_EXECUTED=true'

      - name: Require terminal collection before selection
        shell: bash
        env:
          REQUEST_IDENTITY: ${{ steps.discovery.outputs.request_identity }}
        run: |
          set -Eeuo pipefail
          collection_status="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$HML_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc \
            "select status from public.collection_jobs where request_identity = '$REQUEST_IDENTITY'")"
          test "$collection_status" = 'COMPLETED'
          echo 'DISCOVERY_TERMINAL_STATUS=COMPLETED'

      - name: Run one authenticated native Daily-6 slot
        shell: bash
        env:
          SLOT_DATE: ${{ steps.slot.outputs.date }}
          SLOT: ${{ steps.slot.outputs.slot }}
          EXPECTED_SHA: ${{ steps.slot.outputs.sha }}
          OPERATIONAL_AUTHORIZATION: ${{ vars.DAILY6_OPERATIONAL_AUTHORIZATION }}
          OPERATIONAL_AUTH_EXPIRES_AT: ${{ vars.DAILY6_OPERATIONAL_AUTH_EXPIRES_AT }}
        run: |
          set -Eeuo pipefail
          test -n "$HML_API_URL"
          test -n "$HML_DAILY6_TOKEN"
          test "$OPERATIONAL_AUTHORIZATION" = 'DAILY6_NATIVE_SEND_AUTHORIZED_V1'
          [[ "$OPERATIONAL_AUTH_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          expires_epoch="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%s)"
          canonical_expiry="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%Y-%m-%dT%H:%M:%SZ)"
          test "$canonical_expiry" = "$OPERATIONAL_AUTH_EXPIRES_AT"
          test "$expires_epoch" -gt "$(date -u +%s)"
          response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$HML_API_URL/internal/daily6/run-slot" \
            -H "Authorization: Bearer $HML_DAILY6_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"date\":\"$SLOT_DATE\",\"slot\":\"$SLOT\",\"city\":\"Campinas\",\"policyVersion\":\"daily6-v1\",\"expectedOperationalSha\":\"$EXPECTED_SHA\"}")"
          printf '%s' "$response" | jq -e --arg date "$SLOT_DATE" --arg slot "$SLOT" \
            '.batchId == ($date + "|" + $slot + "|campinas-sp|daily6-v1")
             and .discoveryExecuted == true
             and .discoveryTerminalStatus == "COMPLETED"
             and (.batchStatus == "COMPLETED" or .batchStatus == "BLOCKED")
             and (.sent >= 0 and .sent <= 2)
             and (.providerCalls >= 0)' >/dev/null
          printf '%s' "$response" | jq -r '"DAILY6_REPORT=" + ({discovered,finalistsEvaluated,autoApproved,ready,providerCalls,sent,delivered,failed,ambiguous,stopReason,batchStatus,batchTerminalReason} | tojson)'
          echo 'daily6_native_slot=PASS'
