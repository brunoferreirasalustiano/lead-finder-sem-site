name: Dependency audit PR diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture npm audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log(JSON.stringify({vulnerabilities:r.vulnerabilities,metadata:r.metadata},null,2));"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-pr-132
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7
