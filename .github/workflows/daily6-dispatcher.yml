name: Daily-6 native dispatcher

# GitHub evaluates scheduled workflows from the default branch.  This small
# control plane therefore lives on main and invokes the already-approved HML
# runtime by its immutable SHA.  The HML branch check makes drift fail closed.
on:
  schedule:
    - cron: '0 12 * * *' # 09:00 America/Sao_Paulo (UTC-3)
    - cron: '0 16 * * *' # 13:00 America/Sao_Paulo (UTC-3)
    - cron: '0 19 * * *' # 16:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved HML SHA
        required: true
        type: string
        default: 835e2aaaf2d165164ec7c5c98c80255dd503c88c
      date:
        description: Current slot date in America/Sao_Paulo (YYYY-MM-DD)
        required: true
        type: string
      slot:
        description: Current Daily-6 slot
        required: true
        type: choice
        options:
          - '09'
          - '13'
          - '16'

permissions:
  contents: read

concurrency:
  group: daily6-dispatcher-${{ github.event.schedule || inputs.date }}-${{ inputs.slot || github.run_id }}
  cancel-in-progress: false

env:
  EXPECTED_OPERATIONAL_SHA: 835e2aaaf2d165164ec7c5c98c80255dd503c88c
  HML_BRANCH: hml/render-supabase-plan-b

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: hml-discovery
    timeout-minutes: 5
    env:
      HML_API_URL: ${{ vars.HML_API_URL }}
      HML_DAILY6_TOKEN: ${{ secrets.HML_DAILY6_TOKEN }}
    steps:
      - name: Checkout default branch control plane
        uses: actions/checkout@v4

      - name: Resolve current Campinas slot without catch-up
        id: slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_DATE: ${{ inputs.date }}
          DISPATCH_SLOT: ${{ inputs.slot }}
          DISPATCH_SHA: ${{ inputs.expected_sha }}
        run: |
          set -Eeuo pipefail
          today="$(TZ=America/Sao_Paulo date +%F)"
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ]; then
            case "$EVENT_SCHEDULE" in
              '0 12 * * *') slot='09' ;;
              '0 16 * * *') slot='13' ;;
              '0 19 * * *') slot='16' ;;
              *) echo 'UNEXPECTED_SCHEDULE' >&2; exit 1 ;;
            esac
            date="$today"
            sha="$EXPECTED_OPERATIONAL_SHA"
          else
            date="$DISPATCH_DATE"
            slot="$DISPATCH_SLOT"
            sha="$DISPATCH_SHA"
          fi
          test "$date" = "$today"
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$slot" =~ ^(09|13|16)$ ]]
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$sha" = "$EXPECTED_OPERATIONAL_SHA"
          {
            echo "date=$date"
            echo "slot=$slot"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify HML branch remains pinned to approved SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.slot.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$HML_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Verify Daily-6 operational authorization gate
        shell: bash
        env:
          OPERATIONAL_AUTHORIZATION: ${{ vars.DAILY6_OPERATIONAL_AUTHORIZATION }}
          OPERATIONAL_AUTH_EXPIRES_AT: ${{ vars.DAILY6_OPERATIONAL_AUTH_EXPIRES_AT }}
        run: |
          set -Eeuo pipefail
          test "$OPERATIONAL_AUTHORIZATION" = 'DAILY6_NATIVE_SEND_AUTHORIZED_V1'
          [[ "$OPERATIONAL_AUTH_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          if ! expires_epoch="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%s 2>/dev/null)"; then
            echo 'DAILY6_OPERATIONAL_AUTH_EXPIRES_AT_INVALID' >&2
            exit 1
          fi
          canonical_expiry="$(date -u -d "$OPERATIONAL_AUTH_EXPIRES_AT" +%Y-%m-%dT%H:%M:%SZ)"
          test "$canonical_expiry" = "$OPERATIONAL_AUTH_EXPIRES_AT"
          now_epoch="$(date -u +%s)"
          test "$expires_epoch" -gt "$now_epoch"

      - name: Run one authenticated native Daily-6 slot
        shell: bash
        env:
          SLOT_DATE: ${{ steps.slot.outputs.date }}
          SLOT: ${{ steps.slot.outputs.slot }}
          EXPECTED_SHA: ${{ steps.slot.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$HML_API_URL"
          test -n "$HML_DAILY6_TOKEN"
          response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$HML_API_URL/internal/daily6/run-slot" \
            -H "Authorization: Bearer $HML_DAILY6_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"date\":\"$SLOT_DATE\",\"slot\":\"$SLOT\",\"city\":\"Campinas\",\"policyVersion\":\"daily6-v1\",\"expectedOperationalSha\":\"$EXPECTED_SHA\"}")"
          printf '%s' "$response" | jq -e --arg date "$SLOT_DATE" --arg slot "$SLOT" \
            '.batchId == ($date + "|" + $slot + "|campinas-sp|daily6-v1") and (.sent >= 0 and .sent <= 2) and (.providerCalls >= 0)' >/dev/null
          echo 'daily6_native_slot=PASS'
