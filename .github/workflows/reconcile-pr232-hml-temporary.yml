name: Reconcile PR 232 with current HML (temporary)

on:
  push:
    branches:
      - fix/hml-readiness-require-0047

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hml-readiness-require-0047
          fetch-depth: 0

      - name: Merge current HML with fail-closed conflict policy
        shell: bash
        run: |
          git fetch origin hml/render-supabase-plan-b
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/hml/render-supabase-plan-b
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            for f in package.json package-lock.json; do
              if git diff --name-only --diff-filter=U | grep -Fxq "$f"; then
                git checkout --theirs -- "$f"
                git add "$f"
              fi
            done
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "FUNCTIONAL_CONFLICTS_BEGIN"
            printf '%s\n' "$remaining"
            echo "FUNCTIONAL_CONFLICTS_END"
            git merge --abort || true
            exit 1
          fi

          rm .github/workflows/reconcile-pr232-hml-temporary.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: reconcile PR 232 with current HML"
          git push origin HEAD:fix/hml-readiness-require-0047
