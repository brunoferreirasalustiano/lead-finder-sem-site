name: Lockfile security fix (one-shot)

on:
  push:
    branches:
      - fix/pr215-final-review-followups-20260807

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable transitive dependencies in lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high
      - name: Commit lockfile correction when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable nanoid lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
