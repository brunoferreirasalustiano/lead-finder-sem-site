name: Daily-6 Render HML wake

# Defense-in-depth for Render free-tier hibernation. This workflow only makes
# a public, read-only liveness GET; it never touches discovery or sending.
on:
  schedule:
    # 09:07-10:07 America/Sao_Paulo (UTC-3), every 13 minutes plus the window boundary.
    - cron: '7,20,33,46,59 12 * * *'
    - cron: '7 13 * * *'
    # 13:07-14:07 America/Sao_Paulo (UTC-3), every 13 minutes plus the window boundary.
    - cron: '7,20,33,46,59 16 * * *'
    - cron: '7 17 * * *'
    # 16:07-17:07 America/Sao_Paulo (UTC-3), every 13 minutes plus the window boundary.
    - cron: '7,20,33,46,59 19 * * *'
    - cron: '7 20 * * *'

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render with read-only liveness check
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 15 -X GET \
            https://lead-finder-api-hml.onrender.com/health/live >/dev/null
          echo 'RENDER_WAKE=PASS'
