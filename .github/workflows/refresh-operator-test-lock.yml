name: Refresh operator test lock
on:
  push:
    branches: [agent/operator-test-api]
    paths:
      - package.json
      - .github/workflows/refresh-operator-test-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-test-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove clean installation
        run: npm ci
      - name: Prove audit gate
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh operator test lockfile'
          git push origin HEAD:agent/operator-test-api
