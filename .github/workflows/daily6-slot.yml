name: Daily-6 slot executor

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved HML commit to execute
        required: true
        type: string
      date:
        description: Slot date in America/Sao_Paulo (YYYY-MM-DD)
        required: true
        type: string
      slot:
        description: Daily-6 slot
        required: true
        type: choice
        options:
          - '09'
          - '13'
          - '16'

permissions:
  contents: read

concurrency:
  group: daily6-slot-${{ inputs.date }}-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  run-slot:
    runs-on: ubuntu-latest
    environment: hml-discovery
    timeout-minutes: 20
    env:
      HML_API_URL: ${{ vars.HML_API_URL }}
      HML_DAILY6_TOKEN: ${{ secrets.HML_DAILY6_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SLOT_DATE: ${{ inputs.date }}
      SLOT: ${{ inputs.slot }}
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Validate control-plane inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SLOT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$SLOT" =~ ^(09|13|16)$ ]]
          test -n "$HML_API_URL"
          test -n "$HML_DAILY6_TOKEN"

      - name: Run one authenticated Daily-6 slot
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$HML_API_URL/internal/daily6/run-slot" \
            -H "Authorization: Bearer $HML_DAILY6_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"date\":\"$SLOT_DATE\",\"slot\":\"$SLOT\",\"city\":\"Campinas\",\"policyVersion\":\"daily6-v1\",\"expectedOperationalSha\":\"$EXPECTED_SHA\"}")"
          printf '%s' "$response" | jq -e '.batchId and (.sent >= 0) and (.providerCalls >= 0)' >/dev/null
          echo "daily6_slot_completed=true"
