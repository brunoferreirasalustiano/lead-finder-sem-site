name: Daily-6 Gmail read-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmail-preflight:
    name: Gmail read-only preflight
    runs-on: ubuntu-latest
    environment: hml-discovery
    timeout-minutes: 1
    steps:
      - name: Execute exactly one authenticated preflight request
        shell: bash
        env:
          HML_DAILY6_TOKEN: ${{ secrets.HML_DAILY6_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          set +e
          http_status="$(curl --silent --output "$response_file" --write-out '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${HML_DAILY6_TOKEN}" \
            "https://lead-finder-api-hml.onrender.com/internal/daily6/gmail-preflight" 2>/dev/null)"
          curl_exit=$?
          set -e
          if [[ "$curl_exit" -ne 0 ]]; then
            http_status=000
          fi

          gmail_auth="$(jq -r 'if .gmailAuth == "PASS" then "PASS" else "FAIL" end' "$response_file" 2>/dev/null || printf 'FAIL')"
          sent_search="$(jq -r 'if .sentSearch == "PASS" then "PASS" else "NOT_PROVEN" end' "$response_file" 2>/dev/null || printf 'NOT_PROVEN')"
          error_class="$(jq -r 'if .errorClass == "AUTH_INVALID" or .errorClass == "TOKEN_REVOKED" or .errorClass == "MISSING_CONFIG" or .errorClass == "NETWORK" or .errorClass == "GOOGLE_API_ERROR" or .errorClass == "UNKNOWN" then .errorClass else "UNKNOWN" end' "$response_file" 2>/dev/null || printf 'UNKNOWN')"

          printf 'HTTP_STATUS=%s\n' "$http_status"
          printf 'GMAIL_RUNTIME_AUTH=%s\n' "$gmail_auth"
          printf 'GMAIL_SENT_SEARCH=%s\n' "$sent_search"
          printf 'ERROR_CLASS=%s\n' "$error_class"

          if [[ "$http_status" != "200" || "$gmail_auth" != "PASS" || "$sent_search" != "PASS" ]]; then
            printf 'STATUS=GMAIL_PREFLIGHT_FAIL\n'
            exit 1
          fi

          printf 'STATUS=GMAIL_PREFLIGHT_PASS\n'
