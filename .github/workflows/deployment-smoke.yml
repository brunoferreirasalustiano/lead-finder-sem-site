name: Deployment smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.github/workflows/deployment-smoke.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.github/workflows/deployment-smoke.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: deployment-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-and-update-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run disposable production deployment smoke
        run: scripts/production-deploy-smoke.sh
      - name: Publish post-merge smoke status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Deployment smoke failed'
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Deployment smoke passed'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='deployment-smoke/post-merge' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
