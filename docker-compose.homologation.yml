name: lead-finder-homologation

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.homologation}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.homologation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.homologation}
  api:
    environment:
      NODE_ENV: homologation
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.homologation}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.homologation}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.homologation}
      PILOT_HOMOLOGATION: 'true'
      PILOT_DATABASE_GUARD: leadfinder_homologation
      PILOT_RESTORE_DB: leadfinder_homologation_restore
      SHADOW_MODE_ENABLED: 'true'
      REAL_PROVIDER_CONFIGURED: 'false'
      COLLECTION_EGRESS_ENABLED: 'false'
      ENABLE_N8N: 'false'
      PILOT_EXTERNAL_PROCESSING_ENABLED: 'false'
      AUTHENTICATED_COLLECTION_ENABLED: 'false'
      AUTOMATED_SENDING_ENABLED: 'false'
      WEBHOOKS_ENABLED: 'false'
      WHATSAPP_AUTOMATION_ENABLED: 'false'
      EMAIL_SENDING_ENABLED: 'false'
      SMS_SENDING_ENABLED: 'false'
      CAMPAIGN_EXTERNAL_CALLS_ENABLED: 'false'
  worker:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.homologation}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.homologation}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.homologation}
      PILOT_HOMOLOGATION: 'true'
      PILOT_DATABASE_GUARD: leadfinder_homologation
      PILOT_RESTORE_DB: leadfinder_homologation_restore
      SHADOW_MODE_ENABLED: 'true'
      PILOT_KILL_SWITCH_ENABLED: ${PILOT_KILL_SWITCH_ENABLED:?Set PILOT_KILL_SWITCH_ENABLED in .env.homologation}
      REAL_PROVIDER_CONFIGURED: 'false'
      COLLECTION_EGRESS_ENABLED: 'false'
      ENABLE_N8N: 'false'
      PILOT_EXTERNAL_PROCESSING_ENABLED: 'false'
      AUTHENTICATED_COLLECTION_ENABLED: 'false'
      AUTOMATED_SENDING_ENABLED: 'false'
      WEBHOOKS_ENABLED: 'false'
      WHATSAPP_AUTOMATION_ENABLED: 'false'
      EMAIL_SENDING_ENABLED: 'false'
      SMS_SENDING_ENABLED: 'false'
      CAMPAIGN_EXTERNAL_CALLS_ENABLED: 'false'
  n8n:
    profiles: !reset [disabled]
