name: NPM Audit Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-audit-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: npm-audit-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture dependency and audit evidence
        shell: bash
        run: |
          cp package-lock.json package-lock.before.json
          npm ls fast-uri --all --json > fast-uri-tree.json
          set +e
          npm audit --json > npm-audit-before.json
          before_status=$?
          npm audit fix --package-lock-only --ignore-scripts
          fix_status=$?
          npm audit --json > npm-audit-after.json
          after_status=$?
          set -e
          cp package-lock.json package-lock.after.json
          printf '%s\n' "$before_status" > npm-audit-before-status.txt
          printf '%s\n' "$fix_status" > npm-audit-fix-status.txt
          printf '%s\n' "$after_status" > npm-audit-after-status.txt
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('npm-audit-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'));
          const tree = JSON.parse(fs.readFileSync('fast-uri-tree.json', 'utf8'));
          const beforeLock = fs.readFileSync('package-lock.before.json', 'utf8');
          const afterLock = fs.readFileSync('package-lock.after.json', 'utf8');
          const summarize = (report) => ({
            auditReportVersion: report.auditReportVersion ?? null,
            vulnerabilities: report.metadata?.vulnerabilities ?? {},
            packages: Object.entries(report.vulnerabilities ?? {}).map(([name, details]) => ({
              name,
              severity: details.severity,
              direct: details.isDirect,
              via: Array.isArray(details.via)
                ? details.via.map((entry) => typeof entry === 'string'
                  ? { dependency: entry }
                  : {
                      source: entry.source,
                      name: entry.name,
                      dependency: entry.dependency,
                      title: entry.title,
                      url: entry.url,
                      severity: entry.severity,
                      range: entry.range,
                    })
                : [],
              effects: details.effects ?? [],
              range: details.range,
              nodes: details.nodes ?? [],
              fixAvailable: details.fixAvailable ?? false,
            })),
          });
          const summary = {
            before: summarize(before),
            after: summarize(after),
            auditFixExitCode: Number(fs.readFileSync('npm-audit-fix-status.txt', 'utf8').trim()),
            packageLockChanged: beforeLock !== afterLock,
            dependencyTree: tree,
          };
          fs.writeFileSync('npm-audit-diagnostic-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          NODE
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: |
            npm-audit-before.json
            npm-audit-after.json
            npm-audit-diagnostic-summary.json
            fast-uri-tree.json
            package-lock.before.json
            package-lock.after.json
            npm-audit-before-status.txt
            npm-audit-fix-status.txt
            npm-audit-after-status.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce high-severity gate after proposed lockfile fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          const high = Number(vulnerabilities.high ?? 0);
          const critical = Number(vulnerabilities.critical ?? 0);
          console.log(JSON.stringify({ high, critical }));
          if (high > 0 || critical > 0) process.exit(1);
          NODE
      - name: Publish isolated lockfile fix branch
        shell: bash
        run: |
          cp package-lock.after.json /tmp/package-lock.fixed.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git switch -C fix/fast-uri-audit-advisory origin/main
          cp /tmp/package-lock.fixed.json package-lock.json
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No lockfile change to publish.'
            exit 0
          fi
          git commit -m 'fix: update vulnerable fast-uri lockfile versions'
          git push --force-with-lease origin HEAD:refs/heads/fix/fast-uri-audit-advisory
