name: Communication experiment lab

on:
  pull_request:
    paths:
      - '.github/workflows/communication-experiment-lab.yml'
      - 'packages/messaging/src/communication-lab.ts'
      - 'packages/messaging/src/communication-lab.test.ts'
      - 'packages/messaging/src/communication-evidence-guards.ts'
      - 'packages/messaging/src/communication-evidence-guards.test.ts'
      - 'scripts/communication-experiment-report.ts'
      - 'scripts/guarded-communication-recommendations.ts'
      - 'docs/communication-experiment-lab.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: communication-experiment-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-communication-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run communication matrix and evidence guard tests
        run: >-
          npx vitest run
          packages/messaging/src/communication-lab.test.ts
          packages/messaging/src/communication-evidence-guards.test.ts
          --reporter=dot

      - name: Generate sanitized experiment reports
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npx tsx scripts/communication-experiment-report.ts
          npx tsx scripts/guarded-communication-recommendations.ts

      - name: Verify report contracts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const experimentPath = 'artifacts/communication-lab/communication-experiment-report.json';
          const report = JSON.parse(fs.readFileSync(experimentPath, 'utf8'));
          if (report.metadata.schemaVersion !== 'v2') throw new Error('REPORT_SCHEMA_V2_REQUIRED');
          if (report.metadata.namedCoreTests < 1000) throw new Error('NAMED_TEST_COUNT_TOO_LOW');
          if (report.metadata.evaluatedScenarios < 10000) throw new Error('SCENARIO_COUNT_TOO_LOW');
          if (report.metadata.evaluatedGuardScenarios !== 2880) throw new Error('GUARD_SCENARIO_COUNT_MISMATCH');
          if (report.metadata.realConversionEvidence !== false) throw new Error('REAL_CONVERSION_CLAIM_FORBIDDEN');
          if (Object.values(report.metadata.externalEffects).some(Boolean)) throw new Error('EXTERNAL_EFFECT_DETECTED');
          if (!report.summary || report.summary.total !== report.metadata.evaluatedScenarios) {
            throw new Error('SUMMARY_MISMATCH');
          }
          const channelSource = report.evidenceGuards?.channelSource;
          const diagnostic = report.evidenceGuards?.diagnostic;
          if (!channelSource || channelSource.total !== 1260 || channelSource.blocked !== 990) {
            throw new Error('CHANNEL_SOURCE_GUARD_MISMATCH');
          }
          if (!diagnostic || diagnostic.total !== 1620 || diagnostic.blocked !== 540) {
            throw new Error('DIAGNOSTIC_GUARD_MISMATCH');
          }
          if (!channelSource.codes.some(({ code, count }) => code === 'CHANNEL_SOURCE_MISMATCH' && count === 990)) {
            throw new Error('CHANNEL_SOURCE_CODE_MISSING');
          }
          if (!diagnostic.codes.some(({ code, count }) => code === 'DIAGNOSTIC_EVIDENCE_REQUIRED' && count === 540)) {
            throw new Error('DIAGNOSTIC_CODE_MISSING');
          }

          const guardedPath = 'artifacts/communication-lab/guarded-communication-recommendations.json';
          const guarded = JSON.parse(fs.readFileSync(guardedPath, 'utf8'));
          if (guarded.metadata.schemaVersion !== 'v3') throw new Error('STRATIFIED_SCHEMA_V3_REQUIRED');
          if (guarded.metadata.evaluatedRecommendationScenarios !== report.metadata.evaluatedScenarios) {
            throw new Error('GUARDED_RECOMMENDATION_SCENARIO_MISMATCH');
          }
          if (guarded.metadata.stratification?.niches !== 9) throw new Error('NICHE_STRATIFICATION_MISMATCH');
          if (guarded.metadata.stratification?.opportunities !== 5) throw new Error('OPPORTUNITY_STRATIFICATION_MISMATCH');
          if (guarded.metadata.stratification?.recommendationsPerGroup !== 3) {
            throw new Error('RECOMMENDATIONS_PER_GROUP_MISMATCH');
          }
          if (guarded.metadata.realConversionEvidence !== false) throw new Error('GUARDED_REAL_CONVERSION_CLAIM_FORBIDDEN');
          if (Object.values(guarded.metadata.externalEffects).some(Boolean)) throw new Error('GUARDED_EXTERNAL_EFFECT_DETECTED');

          const cold = guarded.stages?.COLD_ACQUISITION;
          const postOptIn = guarded.stages?.POST_OPT_IN;
          const all = guarded.stages?.ALL_GUARDED;
          if (!cold || !postOptIn || !all) throw new Error('COMMUNICATION_STAGES_MISSING');
          if (cold.summary.total + postOptIn.summary.total !== all.summary.total) {
            throw new Error('STAGE_TOTALS_DO_NOT_RECONCILE');
          }
          if (cold.summary.byChannel.some(({ key }) => key === 'WHATSAPP_OPT_IN')) {
            throw new Error('WHATSAPP_FORBIDDEN_IN_COLD_ACQUISITION');
          }
          if (Object.hasOwn(cold.topByChannel, 'WHATSAPP_OPT_IN')) {
            throw new Error('WHATSAPP_TOP_FORBIDDEN_IN_COLD_ACQUISITION');
          }
          if (postOptIn.summary.byChannel.some(({ key }) => key !== 'WHATSAPP_OPT_IN')) {
            throw new Error('NON_WHATSAPP_CHANNEL_IN_POST_OPT_IN');
          }
          if (postOptIn.guardedPatterns.channel !== 'WHATSAPP_OPT_IN') {
            throw new Error('POST_OPT_IN_CHANNEL_MISMATCH');
          }

          const expectedNiches = [
            'BEAUTY', 'AUTOMOTIVE', 'FOOD', 'HOME_SERVICES', 'LOCAL_RETAIL',
            'PET', 'FITNESS_EDUCATION', 'CREATIVE_EVENTS', 'LOCAL_B2B',
          ];
          const expectedOpportunities = [
            'NO_SITE', 'THIRD_PARTY_ONLY', 'WEAK_SITE', 'BROKEN_SITE', 'WEAK_CONVERSION',
          ];

          function verifyStratification(stage) {
            if (Object.keys(stage.topByNiche ?? {}).length !== expectedNiches.length) {
              throw new Error(`NICHE_COVERAGE_MISSING:${stage.stage}`);
            }
            if (Object.keys(stage.topByOpportunity ?? {}).length !== expectedOpportunities.length) {
              throw new Error(`OPPORTUNITY_COVERAGE_MISSING:${stage.stage}`);
            }
            for (const niche of expectedNiches) {
              const variants = stage.topByNiche[niche];
              if (!Array.isArray(variants) || variants.length !== 3) {
                throw new Error(`NICHE_RECOMMENDATIONS_MISSING:${stage.stage}:${niche}`);
              }
              if (new Set(variants.map(({ id }) => id)).size !== variants.length) {
                throw new Error(`NICHE_RECOMMENDATION_DUPLICATE:${stage.stage}:${niche}`);
              }
              if (variants.some((variant) => variant.niche !== niche)) {
                throw new Error(`NICHE_RECOMMENDATION_MISMATCH:${stage.stage}:${niche}`);
              }
            }
            for (const opportunity of expectedOpportunities) {
              const variants = stage.topByOpportunity[opportunity];
              if (!Array.isArray(variants) || variants.length !== 3) {
                throw new Error(`OPPORTUNITY_RECOMMENDATIONS_MISSING:${stage.stage}:${opportunity}`);
              }
              if (new Set(variants.map(({ id }) => id)).size !== variants.length) {
                throw new Error(`OPPORTUNITY_RECOMMENDATION_DUPLICATE:${stage.stage}:${opportunity}`);
              }
              if (variants.some((variant) => variant.opportunity !== opportunity)) {
                throw new Error(`OPPORTUNITY_RECOMMENDATION_MISMATCH:${stage.stage}:${opportunity}`);
              }
            }
          }

          for (const stage of [cold, postOptIn, all]) {
            verifyStratification(stage);
            if (!stage.guardedPatterns?.requiresVerifiedDiagnosticEvidence) {
              throw new Error(`DIAGNOSTIC_EVIDENCE_CONDITION_MISSING:${stage.stage}`);
            }
            for (const variants of Object.values(stage.topByChannel ?? {})) {
              if (!Array.isArray(variants) || variants.length === 0) throw new Error('GUARDED_TOP_VARIANTS_MISSING');
              for (const variant of variants) {
                if (!variant.sourceType) throw new Error('GUARDED_SOURCE_TYPE_MISSING');
                if (variant.opening === 'DIAGNOSIS_FIRST' && variant.diagnosticEvidenceRequired !== true) {
                  throw new Error('UNGUARDED_DIAGNOSIS_RECOMMENDATION');
                }
                if (stage.stage === 'COLD_ACQUISITION' && variant.channel === 'WHATSAPP_OPT_IN') {
                  throw new Error('COLD_ACQUISITION_WHATSAPP_VARIANT');
                }
              }
            }
          }
          console.log(JSON.stringify({
            commit: report.metadata.commit,
            namedCoreTests: report.metadata.namedCoreTests,
            evaluatedScenarios: report.metadata.evaluatedScenarios,
            evaluatedGuardScenarios: report.metadata.evaluatedGuardScenarios,
            coldAcquisition: cold.summary,
            postOptIn: postOptIn.summary,
            nicheCoverage: Object.keys(cold.topByNiche).length,
            opportunityCoverage: Object.keys(cold.topByOpportunity).length,
          }));
          NODE

      - name: Publish report summary
        if: always()
        run: |
          if [[ -f artifacts/communication-lab/communication-experiment-report.md ]]; then
            cat artifacts/communication-lab/communication-experiment-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Communication experiment report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f artifacts/communication-lab/guarded-communication-recommendations.md ]]; then
            cat artifacts/communication-lab/guarded-communication-recommendations.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Guarded communication recommendations were not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized experiment artifacts
        if: always() && hashFiles('artifacts/communication-lab/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: communication-experiment-lab
          path: artifacts/communication-lab/
          if-no-files-found: error
          retention-days: 14
