name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
        run: docker compose config
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t lead-finder-api:test .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t lead-finder-worker:test .
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadfinder
          POSTGRES_USER: leadfinder
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadfinder -d leadfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadfinder:integration-only@127.0.0.1:5432/leadfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Apply migrations twice to verify version control
        run: npm run db:migrate && npm run db:migrate
      - name: Run deterministic API, queue, worker and CSV integration
        run: npm run test:integration
