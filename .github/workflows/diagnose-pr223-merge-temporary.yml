name: Diagnose PR 223 merge conflicts (temporary)

on:
  push:
    branches:
      - fix/pr215-final-review-followups-20260807

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr215-final-review-followups-20260807
          fetch-depth: 0
      - name: Diagnose merge conflicts against current HML
        shell: bash
        run: |
          git fetch origin hml/render-supabase-plan-b
          set +e
          git merge --no-commit --no-ff origin/hml/render-supabase-plan-b
          status=$?
          echo "MERGE_STATUS=$status"
          echo "CONFLICT_FILES_BEGIN"
          git diff --name-only --diff-filter=U
          echo "CONFLICT_FILES_END"
          git merge --abort || true
          exit 0
