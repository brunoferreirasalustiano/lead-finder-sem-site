name: NPM audit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-audit-diagnostic.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible lockfile-only fix
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=high
          git diff --check
      - name: Commit verified lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: update find-my-way to patched lockfile version'
          git push origin HEAD:${{ github.head_ref }}
