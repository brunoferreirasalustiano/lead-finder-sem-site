name: Operational smoke
on:
  push:
    branches: [feat/estrutura-inicial]
  workflow_dispatch:
    inputs:
      run_live_overpass:
        description: Run one optional collection against the public Overpass API
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  operational-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create temporary environment
        shell: bash
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          {
            echo "POSTGRES_DB=leadfinder"
            echo "POSTGRES_USER=leadfinder"
            echo "POSTGRES_PASSWORD=$PASSWORD"
            echo "SHADOW_MODE_ENABLED=true"
            echo "DATABASE_URL=postgresql://leadfinder:$PASSWORD@postgres:5432/leadfinder"
            echo "API_PORT=3000"
            echo "OVERPASS_URL=http://host.docker.internal:18080"
            echo "OVERPASS_TIMEOUT_MS=3000"
            echo "OVERPASS_MAX_RETRIES=1"
            echo "WORKER_POLL_INTERVAL_MS=1000"
            echo "DAILY_LEAD_LIMIT=50"
          } > .env
      - name: Validate and build Compose stack
        run: |
          docker compose config --quiet
          docker compose build --no-cache api worker migrate
          docker compose down -v --remove-orphans
      - name: Start PostgreSQL and apply idempotent migrations
        run: |
          docker compose up -d postgres
          timeout 60 bash -c 'until [ "$(docker inspect --format={{.State.Health.Status}} $(docker compose ps -q postgres))" = healthy ]; do sleep 2; done'
          docker compose run --rm migrate | tee /tmp/migrate-first.log
          docker compose run --rm migrate | tee /tmp/migrate-second.log
          grep -q '0001_initial applied' /tmp/migrate-first.log
          grep -q '0001_initial already applied' /tmp/migrate-second.log
          docker compose exec -T postgres psql -U leadfinder -d leadfinder -v ON_ERROR_STOP=1 -c "select version from schema_migrations;"
          docker compose exec -T postgres psql -U leadfinder -d leadfinder -v ON_ERROR_STOP=1 -c "select tablename from pg_tables where schemaname='public' and tablename in ('leads','collection_jobs','schema_migrations') order by tablename;"
          docker compose exec -T postgres psql -U leadfinder -d leadfinder -v ON_ERROR_STOP=1 -c "select indexname from pg_indexes where schemaname='public' and indexname in ('leads_osm_identity_uidx','leads_filter_idx','collection_jobs_status_created_idx') order by indexname;"
      - name: Start deterministic mock and application stack
        run: |
          nohup npm run mock:overpass >/tmp/mock-overpass.log 2>&1 &
          echo $! >/tmp/mock-overpass.pid
          timeout 30 bash -c 'until curl -fsS -X POST http://127.0.0.1:18080 >/dev/null; do sleep 1; done'
          docker compose up -d api worker
          timeout 90 bash -c 'until [ "$(docker inspect --format={{.State.Health.Status}} $(docker compose ps -q api))" = healthy ] && [ "$(docker inspect --format={{.State.Health.Status}} $(docker compose ps -q worker))" = healthy ]; do sleep 2; done'
          docker compose ps
          docker compose logs --no-color --tail=150 api worker postgres
      - name: Verify live and ready health behavior
        run: |
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:3000/health/live
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/health/ready
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:3000/health
          docker compose stop postgres
          curl --fail http://127.0.0.1:3000/health/live
          test "$(curl -sS -o /tmp/ready-down.json -w '%{http_code}' http://127.0.0.1:3000/health/ready)" = 503
          docker compose start postgres
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/health/ready
      - name: Run mock collection and verify persistence and deduplication
        shell: bash
        run: |
          BODY='{"city":"Campinas","state":"SP","country":"Brasil","category":"oficinas","limit":5}'
          test "$(curl -sS -o /tmp/collect-1.json -w '%{http_code}' -X POST http://127.0.0.1:3000/collect -H 'Content-Type: application/json' -d "$BODY")" = 202
          timeout 60 bash -c "until [ \"\$(docker compose exec -T postgres psql -U leadfinder -d leadfinder -Atc \"select count(*) from collection_jobs where status='COMPLETED'\")\" -ge 1 ]; do sleep 2; done"
          docker compose exec -T postgres psql -U leadfinder -d leadfinder -v ON_ERROR_STOP=1 -c "select count(*) as completed_jobs from collection_jobs where status='COMPLETED'; select count(*) as leads from leads; select score,status,(website is null) as website_absent from leads;"
          test "$(docker compose exec -T postgres psql -U leadfinder -d leadfinder -Atc 'select count(*) from leads')" = 1
          test "$(curl -sS -o /tmp/collect-2.json -w '%{http_code}' -X POST http://127.0.0.1:3000/collect -H 'Content-Type: application/json' -d "$BODY")" = 202
          timeout 60 bash -c "until [ \"\$(docker compose exec -T postgres psql -U leadfinder -d leadfinder -Atc \"select count(*) from collection_jobs where status='COMPLETED'\")\" -ge 2 ]; do sleep 2; done"
          test "$(docker compose exec -T postgres psql -U leadfinder -d leadfinder -Atc 'select count(*) from leads')" = 1
      - name: Verify two real worker containers claim once
        shell: bash
        run: |
          docker compose up -d --scale worker=2
          BODY='{"city":"Campinas","state":"SP","country":"Brasil","category":"oficinas","limit":5}'
          BEFORE="$(docker compose exec -T postgres psql -U leadfinder -d leadfinder -Atc "select count(*) from collection_jobs where status='COMPLETED'")"
          curl --fail -X POST http://127.0.0.1:3000/collect -H 'Content-Type: application/json' -d "$BODY" >/dev/null
          timeout 60 bash -c "until [ \"\$(docker compose exec -T postgres psql -U leadfinder -d leadfinder -Atc \"select count(*) from collection_jobs where status='COMPLETED'\")\" -eq $((BEFORE+1)) ]; do sleep 2; done"
          test "$(docker compose exec -T postgres psql -U leadfinder -d leadfinder -Atc 'select count(*) from leads')" = 1
          docker compose up -d --scale worker=1
      - name: Verify operational CSV
        run: |
          curl --fail -D /tmp/leads.headers http://127.0.0.1:3000/leads/export.csv --output /tmp/leads.csv
          grep -qi 'content-type: text/csv; charset=utf-8' /tmp/leads.headers
          grep -qi 'content-disposition: attachment; filename="leads.csv"' /tmp/leads.headers
          node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/leads.csv','utf8');if(!s.startsWith('id,name,category'))throw Error('header');if(!s.includes(\"'=Oficina\"))throw Error('CSV injection');if(!s.includes('São José'))throw Error('UTF-8');if(!s.includes('""São José""'))throw Error('quotes');"
      - name: Inspect image security without printing environment
        shell: bash
        run: |
          API_IMAGE="$(docker compose images -q api)"
          WORKER_IMAGE="$(docker compose images -q worker)"
          for IMAGE in "$API_IMAGE" "$WORKER_IMAGE"; do
            test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = node
            test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = amd64
            docker image inspect --format 'image={{.Id}} user={{.Config.User}} architecture={{.Architecture}} size={{.Size}}' "$IMAGE"
          done
          docker inspect "$(docker compose ps -q postgres)" | jq -e '.[0].HostConfig.PortBindings["5432/tcp"] == null'
          docker inspect "$(docker compose ps -q api)" | jq -e '.[0].HostConfig.PortBindings["3000/tcp"][0].HostIp == "127.0.0.1"'
      - name: Verify graceful shutdown and restart
        run: |
          docker compose stop api worker
          for SERVICE in api worker; do test "$(docker inspect --format '{{.State.ExitCode}}' $(docker compose ps -aq "$SERVICE" | head -1))" = 0; done
          ! docker compose logs --no-color api worker | grep -E 'unhandledRejection|uncaughtException'
          docker compose up -d api worker
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/health/ready
      - name: Optional public Overpass collection
        if: ${{ inputs.run_live_overpass }}
        run: |
          sed -i 's#^OVERPASS_URL=.*#OVERPASS_URL=https://overpass-api.de/api/interpreter#' .env
          docker compose up -d --force-recreate worker
          curl --fail -X POST http://127.0.0.1:3000/collect -H 'Content-Type: application/json' -d '{"city":"Campinas","state":"SP","country":"Brasil","category":"oficinas","limit":3}' >/dev/null
          echo 'Public Overpass job submitted; inspect only aggregate job status.'
          sleep 20
          docker compose exec -T postgres psql -U leadfinder -d leadfinder -c "select status,count(*) from collection_jobs group by status order by status;"
      - name: Sanitized logs and cleanup
        if: always()
        shell: bash
        run: |
          if [ -f .env ]; then source .env; echo "::add-mask::$POSTGRES_PASSWORD"; fi
          docker compose logs --no-color --tail=200 2>&1 | sed -E 's#postgresql://[^[:space:]]+#postgresql://***#g' || true
          docker compose down -v --remove-orphans || true
          if [ -f /tmp/mock-overpass.pid ]; then kill "$(cat /tmp/mock-overpass.pid)" 2>/dev/null || true; fi
          rm -f .env /tmp/leads.csv /tmp/leads.headers /tmp/collect-*.json /tmp/ready-down.json /tmp/migrate-*.log
