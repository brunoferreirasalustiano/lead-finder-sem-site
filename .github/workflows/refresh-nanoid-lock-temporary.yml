name: Refresh NanoID lock (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - hml/render-supabase-plan-b

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lock without package scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched NanoID resolution
        run: node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/nanoid']; if (!p || p.version !== '5.1.16') { console.error('Unexpected nanoid lock resolution'); process.exit(1) }"

      - name: Upload generated lock only
        uses: actions/upload-artifact@v4
        with:
          name: patched-nanoid-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high
