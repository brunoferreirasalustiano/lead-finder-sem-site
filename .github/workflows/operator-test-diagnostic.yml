name: Operator test diagnostic

on:
  pull_request:
    paths:
      - 'apps/api/src/operator-test-routes.ts'
      - 'apps/api/src/operator-test-routes.test.ts'
      - 'apps/api/src/operator-test-route-policy.test.ts'
      - 'packages/shared/src/config.ts'
      - 'packages/shared/src/operator-test-config.test.ts'
      - '.github/workflows/operator-test-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture targeted test result
        shell: bash
        run: |
          set +e
          npx vitest run \
            apps/api/src/operator-test-routes.test.ts \
            apps/api/src/operator-test-route-policy.test.ts \
            packages/shared/src/operator-test-config.test.ts \
            --reporter=verbose > operator-test-diagnostic.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> operator-test-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: operator-test-diagnostic
          path: operator-test-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
