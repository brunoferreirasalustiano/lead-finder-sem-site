name: NPM audit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-audit-diagnostic.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build compact audit summary
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          printf '%s' "$audit_status" > npm-audit-status.txt
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            via: (item.via ?? []).map((entry) =>
              typeof entry === 'string'
                ? entry
                : {
                    source: entry.source,
                    name: entry.name,
                    severity: entry.severity,
                    title: entry.title,
                    url: entry.url,
                    range: entry.range,
                  },
            ),
            effects: item.effects,
            fixAvailable: item.fixAvailable,
          }));

          const summary = JSON.stringify({ metadata: report.metadata, vulnerabilities }, null, 2);
          writeFileSync('npm-audit-summary.json', summary);
          console.log(summary);
          NODE
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-summary
          path: |
            npm-audit-summary.json
            npm-audit-status.txt
          retention-days: 1
      - name: Preserve audit result
        shell: bash
        run: test "$(cat npm-audit-status.txt)" -eq 0
