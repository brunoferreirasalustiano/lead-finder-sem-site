name: Temporary PR241 search_path hardening

on:
  push:
    branches:
      - fix/precontact-email-suppression-rebased-20260808
    paths:
      - .github/workflows/tmp-pr241-search-path-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/precontact-email-suppression-rebased-20260808
      - name: Harden 0048 function search paths
        shell: python
        run: |
          from pathlib import Path
          path = Path('database/migrations/0048_precontact_email_delivery_suppression.sql')
          text = path.read_text()
          old = 'SET search_path=pg_catalog,public,lead_finder_private'
          new = 'SET search_path=pg_catalog, public'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly 3 search_path occurrences, found {count}')
          path.write_text(text.replace(old, new))
      - name: Verify scoped diff
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only | tr -d '\r')" = "database/migrations/0048_precontact_email_delivery_suppression.sql"
          test "$(git diff -- database/migrations/0048_precontact_email_delivery_suppression.sql | grep -c '^-SET search_path=pg_catalog,public,lead_finder_private$')" -eq 3
          test "$(git diff -- database/migrations/0048_precontact_email_delivery_suppression.sql | grep -c '^+SET search_path=pg_catalog, public$')" -eq 3
      - name: Commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/migrations/0048_precontact_email_delivery_suppression.sql
          git commit -m 'fix: harden precontact suppression function search paths'
          git push origin HEAD:fix/precontact-email-suppression-rebased-20260808
