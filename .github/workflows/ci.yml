name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
        run: docker compose config
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t lead-finder-api:test .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t lead-finder-worker:test .
