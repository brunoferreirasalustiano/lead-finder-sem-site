name: Daily-6 schedule heartbeat

# This workflow is intentionally incapable of reaching external services or
# commercial identities. It only records whether GitHub creates a scheduled run.
on:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record scheduled event metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'heartbeat_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
          printf 'github_event_name=%s\n' "$GITHUB_EVENT_NAME"
          printf 'github_event_schedule=%s\n' '${{ github.event.schedule }}'
          printf 'github_sha=%s\n' "$GITHUB_SHA"
          printf 'github_ref=%s\n' "$GITHUB_REF"
