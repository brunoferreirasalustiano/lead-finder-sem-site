name: PR257 lockfile repair artifact

on:
  push:
    branches:
      - ops/default-branch-discovery-launcher

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'chore: commit audited lockfile repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate non-forced lockfile security repair
        run: npm audit fix --package-lock-only --audit-level=high
      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high
      - name: Prove bounded lockfile-only repair
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only)" = "package-lock.json"
          git diff --stat -- package-lock.json
      - name: Commit generated lockfile repair
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: update nanoid lockfile to patched version'
          git push origin HEAD:ops/default-branch-discovery-launcher
