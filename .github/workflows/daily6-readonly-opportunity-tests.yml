name: Daily-6 read-only opportunity tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily6-readonly-opportunity-tests
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_PROFILE: supabase-render
      DEPLOYMENT_ENVIRONMENT: homologation
      DRY_RUN: 'true'
      REAL_SEND_ENABLED: 'false'
      REAL_PROVIDERS_ENABLED: 'false'
      COLLECTION_EGRESS_ENABLED: 'false'
      ENRICHMENT_EGRESS_ENABLED: 'false'
      SHADOW_MODE_ENABLED: 'true'
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build without starting services
        run: npm run build

      - name: Run read-only opportunity and safety tests
        run: >-
          npx vitest run
          apps/api/src/daily6-whatsapp-opportunities-route.test.ts
          apps/api/src/dailywhatsapp-cnpj-opportunities-route.test.ts
          packages/database/src/daily6-whatsapp-opportunity-migration.test.ts
          packages/database/src/dailywhatsapp-cnpj-migration.test.ts
          packages/database/src/runtime-role-sql.test.ts
          packages/shared/src/config.test.ts
          --reporter=dot

      - name: Verify clean diff
        run: git diff --check

      - name: Publish sanitized summary
        if: always()
        run: |
          {
            echo '## Daily-6 read-only opportunity tests'
            echo "- Revision: \\`$GITHUB_SHA\\`"
            echo '- Mode: read-only contract tests (no discovery, provider, Gmail, batch, ledger, or schedule)'
            echo "- Result: \\`${{ job.status }}\\`"
          } >> "$GITHUB_STEP_SUMMARY"
