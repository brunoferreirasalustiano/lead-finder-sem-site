name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment-profile: [oracle-vps, supabase-render]
    env:
      DEPLOYMENT_PROFILE: ${{ matrix.deployment-profile }}
      DRY_RUN: 'true'
      REAL_SEND_ENABLED: 'false'
      REAL_PROVIDERS_ENABLED: 'false'
      COLLECTION_EGRESS_ENABLED: 'false'
      SHADOW_MODE_ENABLED: 'true'
      INTERNAL_CRON_SECRET: synthetic-ci-internal-cron-secret-0001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: git diff --check
      - name: Validate Plan B descriptors and Edge Function
        run: |
          ruby -e "require 'yaml'; YAML.safe_load_file('render.yaml', aliases: true)"
          grep -q 'plan: free' render.yaml
          grep -q 'verify_jwt = false' deploy/supabase/config.toml
          ! git grep -nE '(service_role|SUPABASE_SERVICE_ROLE_KEY)=[^[:space:]]+' -- ':!docs/**' ':!.env.example'
          bash -n scripts/database/export-postgres.sh scripts/database/import-postgres.sh
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check deploy/supabase/functions/process-lead-batch/index.ts
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          API_AUTH_TOKEN: synthetic-ci-api-token-not-a-secret-0001
          API_AUTH_PERMISSIONS: pilot:read,pilot:write,pilot:review,pilot:record-contact,pilot:record-result
          SHADOW_MODE_ENABLED: 'false'
          PILOT_KILL_SWITCH_ENABLED: 'false'
        run: docker compose config
      - name: Validate Oracle Compose
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          DATABASE_URL: postgresql://leadfinder:ci-not-a-secret@postgres:5432/leadfinder
          API_AUTH_TOKEN: synthetic-ci-api-token-not-a-secret-0001
          API_AUTH_PERMISSIONS: pilot:read
        run: docker compose -f deploy/oracle/docker-compose.oracle.yml config
      - name: Validate deployment scripts
        run: |
          bash -n scripts/setup-oracle-vps.sh
          bash -n scripts/deploy-production.sh
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          bash -n scripts/deploy-unit-test.sh
          bash -n scripts/production-deploy-smoke.sh
          scripts/deploy-unit-test.sh
      - name: Validate production Docker Compose
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          API_AUTH_TOKEN: synthetic-ci-api-token-not-a-secret-0001
          API_AUTH_PERMISSIONS: pilot:read,pilot:write,pilot:review,pilot:record-contact,pilot:record-result
          DATABASE_URL: postgresql://leadfinder:ci-not-a-secret@postgres:5432/leadfinder
          N8N_ENCRYPTION_KEY: ci-not-a-secret
          SHADOW_MODE_ENABLED: 'false'
          PILOT_KILL_SWITCH_ENABLED: 'false'
          API_DOMAIN: api.example.invalid
          N8N_DOMAIN: automation.example.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml config
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f deploy/docker-compose.tunnel.yml config
          CADDYFILE_PATH=./deploy/Caddyfile.api.example docker compose -f docker-compose.yml -f docker-compose.production.yml -f deploy/docker-compose.public.yml config
          CADDYFILE_PATH=./deploy/Caddyfile.api-n8n.example docker compose -f docker-compose.yml -f docker-compose.production.yml -f deploy/docker-compose.public.yml --profile n8n config
      - name: Build API image
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: docker build -f apps/api/Dockerfile -t lead-finder-api:test .
      - name: Build worker image
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: docker build -f apps/worker/Dockerfile -t lead-finder-worker:test .
      - name: Publish validation summary
        if: always()
        run: |
          echo '## Validate' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
  multiarch:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build API for AMD64 and ARM64 without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=api-v2
          cache-to: type=gha,mode=max,scope=api-v2
      - name: Build worker for AMD64 and ARM64 without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=worker-v2
          cache-to: type=gha,mode=max,scope=worker-v2
      - name: Verify production image manifests
        run: |
          for image in postgres:16-alpine caddy:2.10-alpine n8nio/n8n:1.99.1; do
            manifest="$(docker buildx imagetools inspect --raw "$image")"
            jq -e '
              [.manifests[]?.platform?.architecture] as $architectures
              | ($architectures | index("amd64")) != null
                and ($architectures | index("arm64")) != null
            ' <<<"$manifest" >/dev/null
          done
  restore-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: restore-compose-only
      DATABASE_URL: postgresql://leadfinder:restore-compose-only@postgres:5432/leadfinder
      API_AUTH_TOKEN: synthetic-restore-compose-token
      API_AUTH_PERMISSIONS: pilot:read
      SHADOW_MODE_ENABLED: 'true'
      PILOT_KILL_SWITCH_ENABLED: 'true'
      RESTORE_SUPPRESSION_MANIFEST_DIR: ./backups
    steps:
      - uses: actions/checkout@v4
      - name: Prove private PostgreSQL and one-shot runner
        run: |
          set -Eeuo pipefail
          cleanup() { docker compose -f docker-compose.yml -f docker-compose.production.yml --profile tools down --volumes --remove-orphans; }
          trap cleanup EXIT
          mkdir -p backups
          docker compose -f docker-compose.yml -f docker-compose.production.yml --profile tools config --format json > compose.json
          jq -e '.services.postgres.ports == null and .services["restore-suppression"].ports == null' compose.json >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.production.yml --profile tools up -d postgres
          [[ "$(docker compose -f docker-compose.yml -f docker-compose.production.yml --profile tools ps --services --status running)" == postgres ]]
          docker compose -f docker-compose.yml -f docker-compose.production.yml run --rm restore-suppression npm run db:migrate
          docker compose -f docker-compose.yml -f docker-compose.production.yml run --rm restore-suppression npm run db:migrate
          docker compose -f docker-compose.yml -f docker-compose.production.yml run --rm restore-suppression node --input-type=module -e "import postgres from 'postgres'; const sql=postgres(process.env.DATABASE_URL,{max:1}); const rows=await sql\`select count(*)::int count from schema_migrations\`; if(!rows[0]?.count)process.exit(2); await sql.end(); console.log(JSON.stringify({result:'RESTORE_COMPOSE_REACHABLE'}));"
          [[ "$(docker compose -f docker-compose.yml -f docker-compose.production.yml --profile tools ps --services --status running)" == postgres ]]
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadfinder
          POSTGRES_USER: leadfinder
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadfinder -d leadfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadfinder:integration-only@127.0.0.1:5432/leadfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Apply migrations twice to verify version control
        run: npm run db:migrate && npm run db:migrate
      - name: Verify Supabase Data API deny-all defaults on PostgreSQL
        run: npm run test:supabase-data-api-security
      - name: Verify manual assisted messaging on PostgreSQL 16
        run: npm run test:manual-messaging
      - name: Run automated synthetic batch gate on PostgreSQL
        run: npm run test:batch-gate
      - name: Run restore suppression reconciliation on PostgreSQL 16
        run: npm run test:restore-suppression
      - name: Run deterministic integration — first pass
        run: npm run test:integration
      - name: Run pilot readiness — second isolated pass on the same PostgreSQL
        env:
          PILOT_REPORT_PATH: artifacts/pilot-readiness.json
        run: npm run test:pilot
      - name: Verify persisted state after logical restart
        env:
          PILOT_REPORT_PATH: artifacts/pilot-readiness.json
        run: npm run test:pilot:restart
      - name: Upload pilot readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-readiness-${{ github.sha }}
          path: artifacts/pilot-readiness.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish integration summary
        if: always()
        run: |
          echo '## Integration and pilot readiness' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f artifacts/pilot-readiness.json ]]; then
            echo '### Evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/pilot-readiness.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
