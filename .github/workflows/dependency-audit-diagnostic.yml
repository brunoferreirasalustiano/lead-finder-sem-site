name: Dependency audit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment-profile: [oracle-vps, supabase-render]
    env:
      DEPLOYMENT_PROFILE: ${{ matrix.deployment-profile }}
      DRY_RUN: 'true'
      REAL_SEND_ENABLED: 'false'
      REAL_PROVIDERS_ENABLED: 'false'
      COLLECTION_EGRESS_ENABLED: 'false'
      SHADOW_MODE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture current npm audit and dependency tree
        shell: bash
        run: |
          set +e
          npm audit --json > "audit-before-${DEPLOYMENT_PROFILE}.json"
          npm ls postcss --all --json > "postcss-tree-${DEPLOYMENT_PROFILE}.json"
          exit 0
      - name: Generate reproducible lockfile-only update
        shell: bash
        run: |
          cp package-lock.json package-lock.before.json
          npm update postcss --package-lock-only
          git diff -- package-lock.json > "postcss-lockfile-${DEPLOYMENT_PROFILE}.patch"
          npm audit --json > "audit-after-${DEPLOYMENT_PROFILE}.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const profile = process.env.DEPLOYMENT_PROFILE;
          for (const phase of ['before', 'after']) {
            const report = JSON.parse(fs.readFileSync(`audit-${phase}-${profile}.json`, 'utf8'));
            const metadata = report.metadata?.vulnerabilities ?? {};
            const findings = Object.entries(report.vulnerabilities ?? {}).map(([name, value]) => ({
              name,
              severity: value.severity,
              isDirect: value.isDirect,
              via: value.via,
              effects: value.effects,
              range: value.range,
              nodes: value.nodes,
              fixAvailable: value.fixAvailable,
            }));
            console.log(JSON.stringify({ profile, phase, metadata, findings }, null, 2));
          }
          NODE
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.deployment-profile }}-${{ github.sha }}
          path: |
            audit-before-${{ matrix.deployment-profile }}.json
            audit-after-${{ matrix.deployment-profile }}.json
            postcss-tree-${{ matrix.deployment-profile }}.json
            postcss-lockfile-${{ matrix.deployment-profile }}.patch
            package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce clean audit after update
        run: npm audit --audit-level=high
