name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
        run: docker compose config
      - name: Validate deployment scripts
        run: |
          bash -n scripts/setup-oracle-vps.sh
          bash -n scripts/deploy-production.sh
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          bash -n scripts/deploy-unit-test.sh
          bash -n scripts/production-deploy-smoke.sh
          scripts/deploy-unit-test.sh
      - name: Validate production Docker Compose
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          DATABASE_URL: postgresql://leadfinder:ci-not-a-secret@postgres:5432/leadfinder
          N8N_ENCRYPTION_KEY: ci-not-a-secret
          API_DOMAIN: api.example.invalid
          N8N_DOMAIN: automation.example.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml config
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f deploy/docker-compose.tunnel.yml config
          CADDYFILE_PATH=./deploy/Caddyfile.api.example docker compose -f docker-compose.yml -f docker-compose.production.yml -f deploy/docker-compose.public.yml config
          CADDYFILE_PATH=./deploy/Caddyfile.api-n8n.example docker compose -f docker-compose.yml -f docker-compose.production.yml -f deploy/docker-compose.public.yml --profile n8n config
      - name: Build API image
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        run: docker build -f apps/api/Dockerfile -t lead-finder-api:test .
      - name: Build worker image
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        run: docker build -f apps/worker/Dockerfile -t lead-finder-worker:test .
      - name: Publish validation summary
        if: always()
        run: |
          echo '## Validate' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
  multiarch:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build API for AMD64 and ARM64 without publishing
        run: docker buildx build --platform linux/amd64,linux/arm64 --cache-from type=gha,scope=api --cache-to type=gha,mode=max,scope=api -f apps/api/Dockerfile .
      - name: Build worker for AMD64 and ARM64 without publishing
        run: docker buildx build --platform linux/amd64,linux/arm64 --cache-from type=gha,scope=worker --cache-to type=gha,mode=max,scope=worker -f apps/worker/Dockerfile .
      - name: Verify production image manifests
        run: |
          for image in postgres:16-alpine caddy:2.10-alpine n8nio/n8n:1.99.1; do
            manifest="$(docker buildx imagetools inspect --raw "$image")"
            jq -e '
              [.manifests[]?.platform?.architecture] as $architectures
              | ($architectures | index("amd64")) != null
                and ($architectures | index("arm64")) != null
            ' <<<"$manifest" >/dev/null
          done
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadfinder
          POSTGRES_USER: leadfinder
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadfinder -d leadfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadfinder:integration-only@127.0.0.1:5432/leadfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Apply migrations twice to verify version control
        run: npm run db:migrate && npm run db:migrate
      - name: Run deterministic integration — first pass
        run: npm run test:integration
      - name: Run pilot readiness — second pass on the same PostgreSQL
        env:
          PILOT_REPORT_PATH: artifacts/pilot-readiness.json
        run: npm run test:pilot
      - name: Upload pilot readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-readiness-${{ github.sha }}
          path: artifacts/pilot-readiness.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish integration summary
        if: always()
        run: |
          echo '## Integration and pilot readiness' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f artifacts/pilot-readiness.json ]]; then
            echo '### Evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/pilot-readiness.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
