name: Discovery pilot one-shot

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved HML commit to execute
        required: true
        type: string
      city:
        description: Discovery city
        required: false
        default: Campinas
        type: string
      state:
        description: Discovery state
        required: false
        default: SP
        type: string
      category:
        description: Existing Lead Finder category
        required: false
        default: saloes-de-beleza
        type: choice
        options:
          - saloes-de-beleza
          - barbearias
          - clinicas
          - restaurantes
          - prestadores-de-servicos
      slot:
        description: Daily-6 slot
        required: true
        type: choice
        options:
          - '09'
          - '13'
          - '16'

env:
  APPROVED_OPERATIONAL_SHA: 9490009217d9c587869eb6b069586ab64fefd33a

permissions:
  contents: read

concurrency:
  group: discovery-pilot-${{ inputs.expected_sha }}-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  one-shot:
    runs-on: ubuntu-latest
    environment: hml-discovery
    timeout-minutes: 20
    env:
      HML_API_URL: https://lead-finder-api-hml.onrender.com
      HML_COLLECTION_TOKEN: ${{ secrets.HML_COLLECTION_TOKEN }}
      DATABASE_URL: ${{ secrets.HML_DATABASE_URL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DEPLOYMENT_ENVIRONMENT: homologation
      DEPLOYMENT_PROFILE: supabase-render
      DATABASE_SSL_MODE: require
      COLLECTION_EGRESS_ENABLED: 'true'
      ENRICHMENT_EGRESS_ENABLED: 'true'
      ENRICHMENT_PROVIDER: composite
      OVERPASS_API_URL: https://overpass-api.de/api/interpreter
      WORKER_MODE: oneshot
      MAX_JOBS_PER_RUN: '1'
      MAX_CANDIDATES_PER_JOB: '40'
      MAX_ENRICHMENT_PER_JOB: '10'
      PILOT_KILL_SWITCH_ENABLED: 'false'
      DRY_RUN: 'true'
      REAL_SEND_ENABLED: 'false'
      REAL_PROVIDERS_ENABLED: 'false'
      SHADOW_MODE_ENABLED: 'true'

    steps:
      - name: Validate requested SHA against approved operational SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -Eeuo pipefail
          test "$REQUESTED_SHA" = "$APPROVED_OPERATIONAL_SHA"

      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Verify exact SHA and required restricted secrets
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -Eeuo pipefail
          test "$EXPECTED_SHA" = "$APPROVED_OPERATIONAL_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$HML_COLLECTION_TOKEN"
          test -n "$DATABASE_URL"
          test -n "$TAVILY_API_KEY"

      - name: Verify hosted HML readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --max-time 15 \
            "$HML_API_URL/health/ready" >/dev/null

      - name: Verify collection auth and egress without enqueueing
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -f collection-preflight.json' EXIT
          status="$(curl --silent --show-error --max-time 15 \
            -o collection-preflight.json -w '%{http_code}' \
            -X POST "$HML_API_URL/collect" \
            -H "Authorization: Bearer $HML_COLLECTION_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          test "$status" = '400'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Enqueue one idempotent collection request
        shell: bash
        env:
          CITY: ${{ inputs.city }}
          STATE: ${{ inputs.state }}
          CATEGORY: ${{ inputs.category }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -Eeuo pipefail
          city_id="$(printf '%s-%s' "$CITY" "$STATE" | tr '[:upper:]' '[:lower:]' | tr -cs '[:alnum:]' '-' | sed 's/^-//;s/-$//')"
          request_identity="$(printf '%s|%s|%s|daily6-v1' "$(TZ=America/Sao_Paulo date +%F)" "$SLOT" "$city_id")"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$HML_API_URL/collect" \
            -H "Authorization: Bearer $HML_COLLECTION_TOKEN" \
            -H "X-Collection-Identity: $request_identity" \
            -H 'Content-Type: application/json' \
            --data "{\"city\":\"$CITY\",\"state\":\"$STATE\",\"country\":\"Brasil\",\"category\":\"$CATEGORY\",\"limit\":40}")"
          printf '%s' "$response" | jq -e '.id and (.status == "PENDING" or .status == "PROCESSING" or .status == "COMPLETED")' >/dev/null
          echo "collection_request_identity=$request_identity"

      - name: Run bounded discovery/enrichment worker
        run: node apps/worker/dist/index.js
